        <div class="business-grid" style="margin-top:18px"><section class="surface surface-pad"><div class="surface-title"><h2>Public seller profile</h2><small>Shown on every menu listing</small></div><form id="seller-profile-form"><label class="field-label" for="seller-name">Public seller name</label><input class="form-input" id="seller-name" name="publicName" required maxlength="60" value="${escapeHtml(profile.publicName)}" /><div class="form-grid-2"><div><label class="field-label" for="seller-owner">Owner / contact name</label><input class="form-input" id="seller-owner" name="ownerName" maxlength="60" value="${escapeHtml(profile.ownerName)}" /></div><div><label class="field-label" for="seller-location">Location</label><input class="form-input" id="seller-location" name="location" maxlength="80" value="${escapeHtml(profile.location)}" /></div></div><div class="form-grid-2"><div><label class="field-label" for="seller-contact-phone">Phone number</label><input class="form-input" id="seller-contact-phone" name="phone" type="tel" maxlength="22" value="${escapeHtml(profile.phone || '')}" placeholder="+234…" /></div><div><label class="field-label" for="seller-contact-whatsapp">WhatsApp number</label><input class="form-input" id="seller-contact-whatsapp" name="whatsapp" type="tel" maxlength="22" value="${escapeHtml(profile.whatsapp || '')}" placeholder="+234…" /></div></div><div class="form-grid-2"><div><label class="field-label" for="seller-latitude">Map latitude</label><input class="form-input" id="seller-latitude" name="latitude" type="number" min="-90" max="90" step="any" value="${escapeHtml(profile.latitude || '')}" placeholder="For nearby search" /></div><div><label class="field-label" for="seller-longitude">Map longitude</label><input class="form-input" id="seller-longitude" name="longitude" type="number" min="-180" max="180" step="any" value="${escapeHtml(profile.longitude || '')}" placeholder="For nearby search" /></div></div><label class="field-label" for="seller-radius">Delivery radius (km)</label><input class="form-input" id="seller-radius" name="deliveryRadiusKm" type="number" min="1" max="200" value="${escapeHtml(profile.deliveryRadiusKm || 25)}" /><label class="field-label" for="seller-bio">Public profile</label><textarea class="form-input" id="seller-bio" name="bio" maxlength="240">${escapeHtml(profile.bio)}</textarea><button class="btn btn-primary btn-wide" type="submit" style="margin-top:12px">Save profile</button></form>
          <form id="payment-request-form" style="margin-top:22px;padding-top:18px;border-top:1px solid var(--line)"><h2 style="font-size:14px;margin:0 0 6px">Create a payment QR for a buyer</h2><p style="font-size:9px;color:#879287;line-height:1.5;margin:0 0 10px">Generate a shareable payment page for an agreed amount. Send the QR/link by WhatsApp or another app.</p><div class="form-grid-2"><div><label class="field-label" for="request-amount">Amount (₦)</label><input class="form-input" id="request-amount" name="amount" type="number" min="100" step="50" required placeholder="12500" /></div><div><label class="field-label" for="request-note">What is it for?</label><input class="form-input" id="request-note" name="note" maxlength="60" placeholder="Order or item" /></div></div><button class="btn btn-primary btn-wide" type="submit" style="margin-top:12px">Create payment QR ${icon('arrow')}</button></form>${requestCard}
          </section><div style="display:grid;gap:18px">${renderPaymentSettings()}${renderCategoryManager()}<section class="surface surface-pad"><div class="surface-title"><h2>Menu listings</h2><small>${ownedFoods.length} published or draft</small></div>${foodRows || '<p class="checkout-empty">No food listings yet.</p>'}<button class="btn btn-light btn-wide" style="margin-top:14px" data-action="new-food">＋ Add food or drink</button>${renderFoodEditor()}</section></div></div>
      </main>`;
    }

    function renderAdmin() {
      const approvalControl = (application, index) => SELLER_VERIFICATION_READY && application.identityVerified === true
        ? `<button class="btn btn-light" data-action="approve-seller" data-index="${index}">Approve seller mode</button>`
        : `<button class="btn btn-light" disabled title="Secure identity verification is not connected">Verification required</button>`;
      const applicationRows = sellerApplications.map((application, index) => `<tr><td><strong>${escapeHtml(application.legalName || application.name)}</strong><br /><span>${escapeHtml(application.email)}</span></td><td><strong>${escapeHtml(application.storeName)}</strong><br /><span>${escapeHtml(application.businessAddress || 'Business address not recorded')}</span><br /><span>${escapeHtml(application.location)}</span><br /><span>${escapeHtml(application.phone || application.whatsapp || '')}</span></td><td>${escapeHtml(application.bio)}</td><td>${new Date(application.createdAt || Date.now()).toLocaleDateString()}</td><td><span class="admin-status">Secure files not received</span><br /><small>Local file selection only; no upload.</small></td><td>${approvalControl(application, index)} <button class="btn btn-danger" data-action="deny-seller" data-index="${index}">Decline</button></td></tr>`).join('');
      const riderRows = riderApplications.map((application, index) => `<tr><td><strong>${escapeHtml(application.name)}</strong><br /><span>${escapeHtml(application.email)}</span><br /><span>${escapeHtml(application.phone)}</span></td><td>${escapeHtml(application.vehicle)} · ${escapeHtml(application.serviceArea)}</td><td>${application.latitude && application.longitude ? `${escapeHtml(application.latitude)}, ${escapeHtml(application.longitude)}` : 'Location pin missing'}</td><td><span class="admin-status">Pending rider review</span></td><td><button class="btn btn-light" data-action="approve-rider" data-index="${index}">Approve rider</button> <button class="btn btn-danger" data-action="deny-rider" data-index="${index}">Decline</button></td></tr>`).join('');
      const accountRows = approvedAccounts.map((account, index) => `<tr><td><strong>${escapeHtml(account.name)}</strong><br /><span>${escapeHtml(account.email)}</span></td><td>${account.role === 'seller' ? 'Seller' : account.role === 'admin' ? 'Admin' : 'Buyer'}${account.sellerId ? `<br /><span>${escapeHtml(sellerProfiles[account.sellerId]?.publicName || '')}</span>` : ''}${account.riderId ? '<br /><span>Approved rider</span>' : ''}</td><td><span class="admin-status approved">Active</span></td><td><button class="btn btn-danger" data-action="revoke-account" data-index="${index}">Revoke</button></td></tr>`).join('');
      return `${renderHeader('inner')}<main class="container business-main"><div class="business-top"><div><span class="eyebrow"><i class="eyebrow-dot"></i> Platform administration</span><h1>Applications & accounts</h1><p>Buyer accounts are active immediately. Rider applications require review; seller activation also needs secure identity verification.</p></div><a class="btn btn-light" href="#/">Back to home</a></div><section class="surface surface-pad" style="margin-bottom:18px"><div class="surface-title"><h2>Seller applications</h2><small>${sellerApplications.length} pending</small></div>${sellerApplications.length ? `<div style="overflow-x:auto"><table class="admin-table"><thead><tr><th>Applicant / legal name</th><th>Business, address & contact</th><th>About</th><th>Applied</th><th>Verification</th><th>Decision</th></tr></thead><tbody>${applicationRows}</tbody></table></div>` : `<div class="cart-empty"><strong>No seller applications</strong><p>Seller activation stays locked until secure identity verification is connected.</p></div>`}</section><section class="surface surface-pad" style="margin-bottom:18px"><div class="surface-title"><h2>Rider / dispatch applications</h2><small>${riderApplications.length} pending</small></div>${riderApplications.length ? `<div style="overflow-x:auto"><table class="admin-table"><thead><tr><th>Applicant</th><th>Transport / area</th><th>Map pin</th><th>Status</th><th>Decision</th></tr></thead><tbody>${riderRows}</tbody></table></div>` : `<div class="cart-empty"><strong>No rider applications</strong><p>New dispatch applications will appear here for admin review.</p></div>`}</section><section class="surface surface-pad"><div class="surface-title"><h2>Active accounts</h2><small>${approvedAccounts.length} active</small></div>${approvedAccounts.length ? `<div style="overflow-x:auto"><table class="admin-table"><thead><tr><th>Account</th><th>Modes</th><th>Status</th><th>Access</th></tr></thead><tbody>${accountRows}</tbody></table></div>` : `<p class="checkout-empty">No accounts yet.</p>`}</section><div class="business-hint">${icon('info')}<span>This admin screen and application queue are browser-local and unprotected. Selected passport/profile images are not uploaded or saved. Seller approval stays disabled until authenticated server-side review, secure private file storage and verification of legal name, business address and profile are connected.</span></div></main>`;
    }

    function renderStoreProfile() {
      const sellerId = state.route.id || 'juniper';
      const profile = sellerFor(sellerId);
      const rating = sellerRating(sellerId);
      const ownProfile = String(state.user?.sellerId || '') === String(sellerId);
      const tagged = isSellerTagged(sellerId);
      const sellerPhone = phoneHref(profile.phone);
      const sellerWhatsApp = whatsappHref(profile.whatsapp || profile.phone);
      const contactControls = `${sellerPhone ? `<a class="btn btn-light" href="${escapeHtml(sellerPhone)}">Call seller</a>` : ''}${sellerWhatsApp ? `<a class="btn btn-light" href="${escapeHtml(sellerWhatsApp)}" target="_blank" rel="noopener noreferrer">WhatsApp seller</a>` : ''}`;
      const tagControl = ownProfile
        ? `<span class="tag-count-label">Your public seller profile</span>`
        : `<button class="tag-button" data-action="${state.user ? 'toggle-seller-tag' : 'tag-seller'}" data-id="${escapeHtml(sellerId)}">${icon('sellerAward')} ${state.user && tagged ? 'Tagged · remove' : 'Tag this seller'}</button><span class="tag-count-label">Get an in-app update when they add food or drinks.</span>`;
      const foodCards = products.filter(product => product.published !== false && product.sellerId === sellerId).map(product => {
        const review = productRating(product.id);
        return `<article class="food-card"><div class="food-art" data-action="food-details" data-id="${escapeHtml(product.id)}">${dishSvg(product.art)}<span class="food-badge">${escapeHtml(product.category)}</span></div><div class="food-content"><h3 data-action="food-details" data-id="${escapeHtml(product.id)}">${escapeHtml(product.name)}</h3><div class="food-seller-row"><span>From ${escapeHtml(profile.publicName)}</span><span class="rating-inline">${starsLabel(review.average)}${review.count ? ` (${review.count})` : ''}</span></div><p>${escapeHtml(product.description)}</p><div class="food-bottom"><span class="food-price">${money(product.price)}</span><button class="btn btn-light" data-action="add" data-id="${escapeHtml(product.id)}">Add to order</button></div></div></article>`;
      }).join('');
      return `${renderHeader('inner')}<main class="container app-main"><a class="flow-back" href="#/menu?table=${encodeURIComponent(state.currentTable)}">${icon('back')} Browse menu</a><section class="seller-profile-banner" style="margin:20px 0 27px"><div class="seller-avatar-large">${escapeHtml(initials(profile.publicName))}</div><div><span class="eyebrow">Public seller profile</span><h1>${escapeHtml(profile.publicName)}</h1><p>${escapeHtml(profile.bio)} · ${escapeHtml(profile.location)}</p><div class="tag-action-row">${tagControl}<span class="tag-count-label">${sellerTagCount(sellerId)} customer tag${sellerTagCount(sellerId) === 1 ? '' : 's'}</span></div>${contactControls ? `<div class="tag-action-row">${contactControls}</div>` : ''}<div class="review-summary"><strong>${rating.average ? rating.average.toFixed(1) : 'New'}</strong><span>${rating.count ? `★ · ${rating.count} food review${rating.count === 1 ? '' : 's'}` : 'No customer reviews yet'}</span></div></div></section><div class="section-heading" style="text-align:left;margin:0 0 20px"><h2>Food & drinks from ${escapeHtml(profile.publicName)}</h2><p>Open a menu item to read comments and add a rating.</p></div><section class="food-grid">${foodCards || '<div class="empty-results">No published menu items yet.</div>'}</section></main>`;
    }

    function renderUpdates() {
      if (!state.user) return `${renderHeader('inner')}<main class="container business-main"><section class="surface surface-pad"><span class="eyebrow">Customer menu updates</span><h1>Sign in to see your updates.</h1><p>Tag a seller to get an in-app notice when they add a new food or drink listing.</p><button class="btn btn-primary" data-action="open-signin">Sign in or create buyer account ${icon('arrow')}</button></section></main>`;
      const updates = notificationsForUser();
      const tagged = taggedSellerIds().map(sellerId => `<a class="btn btn-light" href="#/store/${encodeURIComponent(sellerId)}">${escapeHtml(publicSellerName(sellerId))}</a>`).join('');
      const taggedRiders = (Array.isArray(riderTags[String(state.user.email || '').toLowerCase()]) ? riderTags[String(state.user.email || '').toLowerCase()] : []).filter(id => riderProfiles[id]?.active).map(id => `<a class="btn btn-light" href="#/rider-profile/${encodeURIComponent(id)}">${escapeHtml(riderProfiles[id].name)}</a>`).join('');
      const rows = updates.map(item => {
        if (item.type === 'new-menu') return `<article class="notification-card ${item.read ? '' : 'unread'}"><strong>${escapeHtml(publicSellerName(item.sellerId))}</strong><p>Added a new menu item: <b>${escapeHtml(item.productName)}</b>.</p><small>${new Date(item.createdAt || Date.now()).toLocaleString()}</small><div><a href="#/food/${encodeURIComponent(item.productId)}">View item</a><a href="#/store/${encodeURIComponent(item.sellerId)}">Seller profile</a></div></article>`;
        return `<article class="notification-card ${item.read ? '' : 'unread'}"><strong>${escapeHtml(item.message || 'Order update')}</strong><p>${item.orderId ? `Order ${escapeHtml(item.orderId)}${item.deliveryStatus ? ` · ${escapeHtml(item.deliveryStatus)}` : ''}` : 'Account or delivery update'}</p><small>${new Date(item.createdAt || Date.now()).toLocaleString()}</small>${item.riderId ? `<div><a href="#/rider-profile/${encodeURIComponent(item.riderId)}">Rider profile</a></div>` : ''}</article>`;
      }).join('');
      const unread = unreadNotificationCount();
      return `${renderHeader('inner')}<main class="container business-main"><div class="business-top"><div><span class="eyebrow"><i class="eyebrow-dot"></i> Customer tags</span><h1>Menu updates</h1><p>Updates from sellers you have tagged. New listings appear here in this browser.</p></div><button class="btn btn-light" data-action="sign-out">Sign out</button></div><section class="surface surface-pad" style="margin-bottom:18px"><div class="surface-title"><h2>Your tagged sellers</h2><small>${taggedSellerIds().length} tagged</small></div><div class="share-actions">${tagged || '<span class="tag-count-label">You have not tagged a seller yet. Open a seller profile to tag them.</span>'}</div></section><section class="surface surface-pad" style="margin-bottom:18px"><div class="surface-title"><h2>Your tagged riders</h2><small>${taggedRiders ? 'Saved' : '0 tagged'}</small></div><div class="share-actions">${taggedRiders || '<span class="tag-count-label">Tag a rider from their public profile.</span>'}</div></section><section class="surface surface-pad"><div class="surface-title"><h2>New food & drink listings</h2>${unread ? `<button class="btn btn-light" data-action="mark-updates-read">Mark ${unread} as seen</button>` : '<small>All caught up</small>'}</div><div class="notification-list">${rows || '<div class="cart-empty"><span class="cart-empty-icon">◉</span><strong>No menu updates yet</strong><p>Tag a seller to see a notice here when they publish new food or drinks.</p></div>'}</div></section><div class="business-hint">${icon('info')}<span>These are in-app updates stored on this device. Push notifications and cross-device sync need a backend and customer permission.</span></div></main>`;
    }

    function renderRiderSearch() {
      const query = String(state.riderSearch || '').trim().toLowerCase();
      const fromCheckout = state.route.params.get('from') === 'checkout';
      const allEntries = riderDirectoryEntries();
      const entries = allEntries.filter(entry => {
        const haystack = [entry.profile.name, entry.profile.serviceArea, entry.profile.vehicle].join(' ').toLowerCase();
        return !query || haystack.includes(query);
      });
      const cards = entries.map(entry => {
        const profile = entry.profile;
        const rating = riderRating(entry.id);
        const canChoose = fromCheckout && state.customerLocation && entry.inServiceRange && totalQty() > 0;
        const selected = state.selectedRiderId === entry.id;
        const status = state.customerLocation
          ? !entry.hasMapPin ? 'Coverage unverified' : entry.inServiceRange ? 'Within service area' : 'Outside service area'
          : `${entry.serviceRadiusKm} km service radius`;
        const distance = Number.isFinite(entry.distance) ? `${entry.distance.toFixed(1)} km away` : entry.hasMapPin ? state.customerLocation ? 'Distance unavailable' : 'Share location to see distance' : 'No map pin';
        const callLink = phoneHref(profile.phone);
        const waLink = whatsappHref(profile.whatsapp || profile.phone);
        const contact = `${callLink ? `<a class="btn btn-light" href="${escapeHtml(callLink)}">Call</a>` : ''}${waLink ? `<a class="btn btn-light" href="${escapeHtml(waLink)}" target="_blank" rel="noopener noreferrer">WhatsApp</a>` : ''}`;
        const chooseControl = fromCheckout
          ? canChoose
            ? `<button class="btn ${selected ? 'btn-primary' : 'btn-light'}" data-action="select-rider-for-delivery" data-id="${escapeHtml(entry.id)}">${selected ? 'Selected · use this rider' : 'Choose this rider'}</button>`
            : `<button class="btn btn-light" disabled>${!state.customerLocation ? 'Location needed' : !entry.hasMapPin ? 'Map pin needed' : 'Outside delivery range'}</button>`
          : '';
        return `<article class="rider-search-card"><div class="rider-search-card-head"><div><h3>${escapeHtml(profile.name || 'Delivery rider')}</h3><small>${escapeHtml(profile.vehicle || 'Delivery')} · ${escapeHtml(profile.serviceArea || 'Service area not listed')}</small></div><span class="rider-status-pill ${state.customerLocation && entry.hasMapPin && !entry.inServiceRange ? 'outside' : ''}">Available</span></div><p>${distance} · ${escapeHtml(status)}${rating.count ? ` · ★ ${rating.average.toFixed(1)} (${rating.count})` : ' · New profile'}</p><div class="rider-search-card-actions"><a class="btn btn-light" href="#/rider-profile/${encodeURIComponent(entry.id)}">View profile</a>${contact}${chooseControl}</div></article>`;
      }).join('');
      const results = cards || (allEntries.length
        ? `<div class="cart-empty"><strong>${query ? 'No available riders match your search.' : 'No riders found for this search.'}</strong><p>Try a name, neighborhood, or transport type such as motorcycle.</p></div>`
        : `<div class="cart-empty"><strong>No approved riders are available right now.</strong><p>Riders must be approved, marked available, and have a profile before they appear here.</p><a class="btn btn-light" href="#/rider-apply">Apply to deliver</a></div>`);
      const locationCopy = state.customerLocation
        ? 'Sorted by distance. Riders outside their stated service radius cannot be selected for this delivery.'
        : 'Allow browser location to sort riders by distance. You can still search by name, neighborhood, or transport; distance cannot be confirmed without permission.';
      return `${renderHeader('inner')}<main class="container rider-directory"><div class="business-top"><div><span class="eyebrow"><i class="eyebrow-dot"></i> Rider directory</span><h1>Find a delivery rider.</h1><p>Search approved riders who are currently available. For delivery checkout, only riders inside their stated service radius can be selected.</p></div><a class="btn btn-light" href="#/rider">Rider portal</a></div>${fromCheckout ? `<div class="business-hint">${icon('info')}<span>Choose an available rider within your current delivery range, then you’ll return to your checkout.</span></div>` : ''}<section class="surface surface-pad" style="margin:18px 0"><div class="rider-directory-tools"><label class="search-wrap">${icon('search')}<input id="rider-search" type="search" value="${escapeHtml(state.riderSearch)}" placeholder="Search name, neighborhood, or transport" aria-label="Search available riders" /></label><button class="btn btn-light" data-action="use-location">${icon('pin')} ${state.customerLocation ? 'Refresh my location' : 'Use my location'}</button></div><p class="rider-directory-note" role="status">${escapeHtml(locationCopy)} ${allEntries.length} available rider${allEntries.length === 1 ? '' : 's'} listed.</p></section><section class="rider-directory-results" aria-label="Available riders">${results}</section><div class="business-hint" style="margin-top:18px">${icon('info')}<span>Location permission is optional for browsing and cannot be forced. Rider availability and profiles are stored in this browser preview, not shared across devices.</span></div></main>`;
    }

    function renderRiderApplication() {
      if (!state.user) return `${renderHeader('inner')}<main class="container business-main"><section class="surface surface-pad"><span class="eyebrow">Delivery rider</span><h1>Apply to deliver with Juniper.</h1><p>Sign in or create a buyer account first. Rider applications are reviewed before a profile can receive delivery requests.</p><button class="btn btn-primary" data-action="open-signin">Sign in or create account ${icon('arrow')}</button></section></main>`;
      if (isRider()) return `${renderHeader('inner')}<main class="container business-main"><section class="surface surface-pad"><h1>Your rider profile is active.</h1><p>Manage availability and assigned deliveries from your rider dashboard.</p><a class="btn btn-primary" href="#/rider">Open rider dashboard ${icon('arrow')}</a></section></main>`;
      const existing = riderApplications.find(application => application.email.toLowerCase() === state.user.email.toLowerCase());
      if (existing) return `${renderHeader('inner')}<main class="container business-main"><section class="surface surface-pad"><span class="eyebrow">Application under review</span><h1>${escapeHtml(existing.name)} · rider application</h1><p>Your buyer or seller account remains available while an admin reviews your delivery profile.</p><span class="admin-status">Pending rider review</span></section></main>`;
      return `${renderHeader('inner')}<main class="container business-main"><div class="business-top"><div><span class="eyebrow">Rider / dispatch application</span><h1>Deliver orders near you.</h1><p>Buyers see available, approved riders closest to their current location.</p></div><a class="btn btn-light" href="#/rider">Rider page</a></div><form id="rider-application-form" class="surface surface-pad rider-application-form"><div class="form-grid-2"><div><label class="field-label" for="rider-name">Name shown to customers</label><input class="form-input" id="rider-name" name="name" required maxlength="60" value="${escapeHtml(state.user.name)}" /></div><div><label class="field-label" for="rider-phone">Phone number</label><input class="form-input" id="rider-phone" name="phone" type="tel" required maxlength="22" placeholder="+234…" /></div></div><label class="field-label" for="rider-whatsapp">WhatsApp number (optional)</label><input class="form-input" id="rider-whatsapp" name="whatsapp" type="tel" maxlength="22" placeholder="+234…" /><div class="form-grid-2"><div><label class="field-label" for="rider-vehicle">Transport</label><select class="form-input" id="rider-vehicle" name="vehicle" required><option value="">Choose transport</option><option>Motorcycle</option><option>Bicycle</option><option>Car</option><option>Van</option><option>Other</option></select></div><div><label class="field-label" for="rider-area">Service area</label><input class="form-input" id="rider-area" name="serviceArea" maxlength="80" required placeholder="Neighborhood or city" /></div></div><button class="btn btn-light" type="button" data-action="use-rider-location">${icon('pin')} Use current location for your map pin</button><p class="summary-note">The browser asks permission. Coordinates are used to show nearby riders and are stored with your local application in this preview.</p><div class="form-grid-2"><div><label class="field-label" for="rider-latitude">Latitude</label><input class="form-input" id="rider-latitude" name="latitude" type="number" step="any" min="-90" max="90" required value="${escapeHtml(state.riderApplicationLocation?.latitude ?? '')}" placeholder="Use the location button" /></div><div><label class="field-label" for="rider-longitude">Longitude</label><input class="form-input" id="rider-longitude" name="longitude" type="number" step="any" min="-180" max="180" required value="${escapeHtml(state.riderApplicationLocation?.longitude ?? '')}" placeholder="Use the location button" /></div></div><div class="form-grid-2"><div><label class="field-label" for="rider-radius">Service radius (km)</label><input class="form-input" id="rider-radius" name="serviceRadiusKm" type="number" min="1" max="100" required value="20" /></div><div><label class="field-label" for="rider-fee">Starting delivery fee (₦)</label><input class="form-input" id="rider-fee" name="baseFee" type="number" min="0" step="50" required value="0" /></div></div><button class="btn btn-primary btn-wide" type="submit">Submit rider application ${icon('arrow')}</button><p class="summary-note">An admin must approve your application before buyers can select you. You can still order as a customer while it is pending.</p></form></main>`;
    }

    function renderRiderDashboard() {
      if (!state.user) return `${renderHeader('inner')}<main class="container business-main"><section class="surface surface-pad"><span class="eyebrow">Rider workspace</span><h1>Sign in to apply or manage deliveries.</h1><p>Buyers and sellers can apply for rider/dispatch access.</p><button class="btn btn-primary" data-action="open-signin">Sign in or create account ${icon('arrow')}</button></section></main>`;
      if (!isRider()) return `${renderHeader('inner')}<main class="container business-main"><section class="surface surface-pad"><span class="eyebrow">Rider / dispatch</span><h1>Deliver with Juniper.</h1><p>Apply to be reviewed as a rider. Once approved, the nearest available orders appear on your rider page.</p><a class="btn btn-primary" href="#/rider-apply">Apply to become a rider ${icon('arrow')}</a></section></main>`;
      const profile = riderProfiles[state.user.riderId];
      const orders = state.orders.filter(order => order.riderId === state.user.riderId).sort((a,b) => new Date(b.createdAt)-new Date(a.createdAt));
      const actionFor = order => order.deliveryStatus === 'assigned' ? `<button class="btn btn-primary" data-action="rider-delivery-status" data-id="${escapeHtml(order.id)}" data-status="accepted">Accept delivery</button>` : order.deliveryStatus === 'accepted' ? `<button class="btn btn-light" data-action="rider-delivery-status" data-id="${escapeHtml(order.id)}" data-status="picked-up">Mark picked up</button>` : order.deliveryStatus === 'picked-up' ? `<button class="btn btn-primary" data-action="rider-delivery-status" data-id="${escapeHtml(order.id)}" data-status="delivered">Mark delivered</button>` : '<span class="admin-status approved">Delivered</span>';
      const orderRows = orders.map(order => `<article class="rider-order-card"><div class="rider-order-top"><strong>Order ${escapeHtml(order.id)}</strong><span class="admin-status ${order.deliveryStatus === 'delivered' ? 'approved' : ''}">${escapeHtml(order.deliveryStatus || 'assigned')}</span></div><p>${escapeHtml(publicSellerName(order.sellerId))} · ${order.quantity} item${order.quantity === 1 ? '' : 's'} · ${money(order.deliveryFee || 0)} delivery fee</p><small>Deliver to: ${escapeHtml(order.deliveryAddress || 'Pickup order')} · Buyer ${escapeHtml(order.user || 'Customer')}</small><div class="rider-order-actions">${actionFor(order)}<a class="btn btn-light" href="#/store/${encodeURIComponent(order.sellerId)}">Seller profile</a></div></article>`).join('');
      return `${renderHeader('inner')}<main class="container business-main"><div class="business-top"><div><span class="eyebrow"><i class="eyebrow-dot"></i> Rider / dispatch page</span><h1>Welcome, ${escapeHtml(profile.name)}.</h1><p>${escapeHtml(profile.vehicle)} · ${escapeHtml(profile.serviceArea)} · ${escapeHtml(profile.serviceRadiusKm)} km service radius</p></div><div class="rider-header-actions"><a class="btn btn-light" href="#/rider-profile/${encodeURIComponent(profile.id)}">View public rider profile</a><button class="btn ${profile.available === false ? 'btn-light' : 'btn-primary'}" data-action="toggle-rider-availability">${profile.available === false ? 'Go available' : 'Pause requests'}</button></div></div><section class="stats-grid"><article class="stat-card"><div class="stat-top">Delivery requests <span class="stat-icon">${icon('bag')}</span></div><strong>${orders.length}</strong><div class="stat-foot"><span>Assigned in this browser</span></div></article><article class="stat-card"><div class="stat-top">Rider rating <span class="stat-icon">★</span></div><strong>${riderRating(profile.id).average ? riderRating(profile.id).average.toFixed(1) : 'New'}</strong><div class="stat-foot"><span>${riderRating(profile.id).count} review${riderRating(profile.id).count === 1 ? '' : 's'}</span></div></article><article class="stat-card"><div class="stat-top">Availability <span class="stat-icon">${icon('clock')}</span></div><strong>${profile.available === false ? 'Paused' : 'Available'}</strong><div class="stat-foot"><span>Buyers see available riders nearby</span></div></article></section><section class="surface surface-pad" style="margin-top:18px"><div class="surface-title"><h2>Assigned deliveries</h2><small>${orders.filter(order => order.deliveryStatus !== 'delivered').length} active</small></div><div class="rider-order-list">${orderRows || '<div class="cart-empty"><strong>No deliveries assigned</strong><p>New delivery assignments appear here and in Menu updates.</p></div>'}</div></section><div class="business-hint">${icon('info')}<span>Rider assignments and updates are stored in this browser preview. Live notifications across devices need a shared server.</span></div></main>`;
    }

    function renderRiderProfile() {
      const riderId = state.route.id;
      const profile = riderProfiles[riderId];
      if (!profile || !profile.active) return `${renderHeader('inner')}<main class="container flow-main"><div class="empty-results"><b>Rider profile unavailable</b><a href="#/menu">Return to the menu</a></div></main>`;
      const rating = riderRating(riderId);
      const items = riderReviewsFor(riderId);
      const reviewRows = items.map(review => `<article class="review-card"><div class="review-card-top"><b>${escapeHtml(review.name)}</b><span class="review-stars">${'★'.repeat(Math.max(1,Math.min(5,Number(review.rating))))}${'☆'.repeat(5-Math.max(1,Math.min(5,Number(review.rating))))}</span></div><p>${escapeHtml(review.comment)}</p><small>${new Date(review.createdAt || Date.now()).toLocaleDateString()}</small></article>`).join('') || '<div class="empty-results" style="padding:18px"><b>No rider reviews yet</b><span>Customers can rate a completed delivery.</span></div>';
      const own = state.user?.riderId === riderId;
      const tagButton = own ? '<span class="tag-count-label">This is your rider profile</span>' : `<button class="tag-button" data-action="${state.user ? 'toggle-rider-tag' : 'tag-rider'}" data-id="${escapeHtml(riderId)}">${icon('spark')} ${isRiderTagged(riderId) ? 'Tagged · remove' : 'Tag rider'}</button>`;
      const call = phoneHref(profile.phone), wa = whatsappHref(profile.whatsapp || profile.phone);
      const contacts = `${call ? `<a class="btn btn-light" href="${escapeHtml(call)}">Call rider</a>` : ''}${wa ? `<a class="btn btn-light" href="${escapeHtml(wa)}" target="_blank" rel="noopener noreferrer">WhatsApp rider</a>` : ''}`;
      const reviewForm = state.user && !own ? `<form id="rider-review-form" class="review-form"><input type="hidden" name="riderId" value="${escapeHtml(riderId)}" /><b style="font-size:10px">Rate this delivery person</b><div class="stars-picker">${[1,2,3,4,5].map(number => `<button type="button" class="${number <= state.selectedRiderRating ? 'selected' : ''}" data-action="select-rider-rating" data-rating="${number}">★</button>`).join('')}</div><input type="hidden" name="rating" value="${state.selectedRiderRating}" /><label class="field-label" for="rider-review-comment">Your comment</label><textarea class="form-input" id="rider-review-comment" name="comment" maxlength="400" required placeholder="Share helpful feedback about the delivery."></textarea><button class="btn btn-primary" type="submit">Post rider review</button></form>` : state.user ? '' : `<div class="review-form"><p>Sign in to tag or review this rider.</p><button class="btn btn-light" data-action="open-signin">Sign in</button></div>`;
      return `${renderHeader('inner')}<main class="container business-main"><a class="flow-back" href="#/rider">${icon('back')} Rider page</a><section class="seller-profile-banner" style="margin:18px 0"><div class="seller-avatar-large">${escapeHtml(initials(profile.name))}</div><div><span class="eyebrow">Approved delivery rider</span><h1>${escapeHtml(profile.name)}</h1><p>${escapeHtml(profile.vehicle)} · ${escapeHtml(profile.serviceArea)} · ${escapeHtml(profile.serviceRadiusKm)} km service radius</p><div class="review-summary"><strong>${rating.average ? rating.average.toFixed(1) : 'New'}</strong><span>${rating.count} rider review${rating.count === 1 ? '' : 's'} · ${riderTagCount(riderId)} customer tag${riderTagCount(riderId) === 1 ? '' : 's'}</span></div><div class="tag-action-row">${tagButton}${contacts}</div></div></section><section class="review-section"><h2>Rider ratings & comments</h2><div class="review-list">${reviewRows}</div>${reviewForm}</section></main>`;
    }

    function renderFoodDetail() {
      const product = products.find(item => item.id === state.route.id);
      if (!product) return `${renderHeader('inner')}<main class="container flow-main"><div class="empty-results"><b>Food not found</b><a href="#/menu?table=${encodeURIComponent(state.currentTable)}">Return to food</a></div></main>`;
      const profile = sellerFor(product.sellerId);
      const rating = productRating(product.id);
      const itemReviews = productReviews(product.id);
      const reviewRows = itemReviews.length ? itemReviews.map(review => `<article class="review-card"><div class="review-card-top"><b>${escapeHtml(review.name)}</b><span class="review-stars">${'★'.repeat(Math.max(1, Math.min(5, Number(review.rating))))}${'☆'.repeat(5 - Math.max(1, Math.min(5, Number(review.rating))))}</span></div><p>${escapeHtml(review.comment)}</p><small>${new Date(review.createdAt || Date.now()).toLocaleDateString()}</small></article>`).join('') : `<div class="empty-results" style="padding:18px"><b>No reviews yet</b><span>Be the first customer to review this item.</span></div>`;
      const reviewForm = state.user ? `<form id="review-form" class="review-form"><b style="font-size:10px">Rate this food</b><div class="stars-picker">${[1,2,3,4,5].map(number => `<button type="button" class="${number <= state.selectedRating ? 'selected' : ''}" data-action="select-rating" data-rating="${number}" aria-label="${number} stars">★</button>`).join('')}</div><input type="hidden" name="rating" value="${state.selectedRating}" /><label class="field-label" for="review-comment">Your comment</label><textarea class="form-input" id="review-comment" name="comment" maxlength="400" required placeholder="What did you enjoy? Keep feedback helpful and respectful."></textarea><button class="btn btn-primary" type="submit" style="margin-top:10px">Post review</button></form>` : `<div class="review-form"><b style="font-size:10px">Sign in or create a buyer account to rate and comment.</b><p style="font-size:9px;color:#859085">Buyer accounts are active right away.</p><button class="btn btn-light" data-action="open-signin">Sign in</button></div>`;

ity)} ${icon('arrow')}</button></section></div><section class="review-section"><h2>Ratings & comments</h2><div class="review-list">${reviewRows}</div>${reviewForm}</section></main>`;

div><div><label class="field-label" for="seller-application-whatsapp">WhatsApp number</label><input class="form-input" id="seller-application-whatsapp" name="whatsapp" type="tel" maxlength="22" placeholder="+234…" /></div></div><small class="field-help">Add a phone number or WhatsApp number so customers can contact your business.</small><div class="form-grid-2"><div><label class="field-label" for="seller-application-latitude">Map latitude (optional)</label><input class="form-input" id="seller-application-latitude" name="latitude" type="number" min="-90" max="90" step="any" value="${escapeHtml(state.sellerApplicationLocation?.latitude ?? '')}" placeholder="e.g. 6.5244" /></div><div><label class="field-label" for="seller-application-longitude">Map longitude (optional)</label><input class="form-input" id="seller-application-longitude" name="longitude" type="number" min="-180" max="180" step="any" value="${escapeHtml(state.sellerApplicationLocation?.longitude ?? '')}" placeholder="e.g. 3.3792" /></div></div><button class="btn btn-light" type="button" data-action="use-seller-location">${icon('pin')} Use current location as business map pin</button><label class="field-label" for="seller-application-radius">Delivery radius (km)</label><input class="form-input" id="seller-application-radius" name="deliveryRadiusKm" type="number" min="1" max="200" value="25" required /><label class="field-label" for="seller-application-about">What do you sell?</label><textarea class="form-input" id="seller-application-about" name="bio" maxlength="240" placeholder="Tell us about your kitchen and menu." required></textarea><div class="privacy-note"><b>Preview only — do not submit real identity documents here.</b> This page has no secure document upload. The passport and profile-photo files are checked in memory only; they are not uploaded or saved. Name and business details are stored in this browser's local application queue. Seller approval remains disabled until secure file handling and protected admin review are connected.</div><button class="btn btn-primary btn-wide" type="submit">Submit business application ${icon('arrow')}</button><div class="privacy-note">Your buyer account remains active while seller verification is unavailable.</div></form>`;
      } else if (isCreate) {
        content = `<h2 id="signin-heading">Create a buyer account</h2><p>Create an account to order, save your details, rate food and comment. Seller mode is a separate application.</p><form id="request-account-form" class="modal-form"><label class="field-label" for="request-name">Full name</label><input class="form-input" id="request-name" name="name" autocomplete="name" placeholder="Your name" required /><label class="field-label" for="request-email">Email address</label><input class="form-input" id="request-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required /><div class="field-error">${escapeHtml(state.modalMessage)}</div><button class="btn btn-primary btn-wide" type="submit">Create buyer account ${icon('arrow')}</button><div class="privacy-note">Buyer access is available right away. You can apply for seller mode later.</div></form>`;

    app.addEventListener('click', event => {

      const button = event.target.closest('[data-action]');
      if (!button) return;
      const action = button.dataset.action;
      if (action === 'open-signin') openSignIn();
      else if (action === 'open-updates') navigate('/updates');
      else if (action === 'tag-seller' || action === 'toggle-seller-tag') {
        if (!state.user && action === 'tag-seller') { openSignIn(); showToast('Sign in or create a buyer account to tag this seller.'); }
        else toggleSellerTag(button.dataset.id);
      }
      else if (action === 'tag-rider' || action === 'toggle-rider-tag') toggleRiderTag(button.dataset.id);
      else if (action === 'select-rider-rating') { state.selectedRiderRating = Math.max(1, Math.min(5, Number(button.dataset.rating || 5))); render(); }
      else if (action === 'use-rider-location' || action === 'use-seller-location') {
        if (!navigator.geolocation?.getCurrentPosition) { showToast('Location is not available in this browser.'); return; }
        navigator.geolocation.getCurrentPosition(position => {
          const pin = { latitude: position.coords.latitude, longitude: position.coords.longitude };
          const prefix = action === 'use-rider-location' ? 'rider' : 'seller-application';
          if (action === 'use-rider-location') state.riderApplicationLocation = pin; else state.sellerApplicationLocation = pin;
          const latitudeInput = document.getElementById(`${prefix}-latitude`), longitudeInput = document.getElementById(`${prefix}-longitude`);
          if (latitudeInput) latitudeInput.value = pin.latitude;
          if (longitudeInput) longitudeInput.value = pin.longitude;
          showToast(action === 'use-rider-location' ? 'Map pin added to the rider application.' : 'Business map pin added. Check that you are at the business location.');
        }, () => showToast('Location permission was not granted.'), { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
      }
      else if (action === 'toggle-rider-availability') {
        if (!isRider()) return;
        const rider = riderProfiles[state.user.riderId]; rider.available = rider.available === false; riderProfiles[state.user.riderId] = rider; saveStore(STORAGE.riders, riderProfiles); render(); showToast(rider.available ? 'You are available for nearby delivery requests.' : 'Delivery requests paused.');
      }
      else if (action === 'rider-delivery-status') updateRiderOrderStatus(button.dataset.id, button.dataset.status);
      else if (action === 'mark-updates-read') {
        if (!state.user) return;
        const email = state.user.email.toLowerCase();
        notifications = (Array.isArray(notifications) ? notifications : []).map(item => item.email?.toLowerCase() === email ? { ...item, read: true } : item);
        saveStore(STORAGE.notifications, notifications); render(); showToast('Menu updates marked as seen.');
      }
      else if (action === 'request-seller') {
        if (!state.user) { openSignIn(); return; }
        state.modalMode = 'seller-request'; state.modalMessage = ''; state.modal = true; render();
        setTimeout(() => document.getElementById('seller-application-name')?.focus(), 30);
      }
      else if (action === 'switch-account-mode') { state.modalMode = button.dataset.mode; state.modalMessage = ''; render(); }
      else if (action === 'close-modal') closeModal();
      else if (action === 'backdrop-close' && event.target === button) closeModal();
      else if (action === 'sign-out') {
        state.user = null; saveStore(STORAGE.user, null); render(); showToast('You are signed out.');
      } else if (action === 'category') {
        state.menuCategory = button.dataset.category || 'All'; render();
      } else if (action === 'food-details') { state.selectedQuantity = 1; navigate(`/food/${encodeURIComponent(button.dataset.id)}`); }
      else if (action === 'food-quantity') { state.selectedQuantity = Math.max(1, Number(state.selectedQuantity || 1) + Number(button.dataset.delta || 0)); render(); }
      else if (action === 'add-quantity') changeCart(button.dataset.id, state.selectedQuantity);
      else if (action === 'select-rating') { state.selectedRating = Math.max(1, Math.min(5, Number(button.dataset.rating || 5))); render(); }
      else if (action === 'delivery-mode') { state.deliveryMode = button.dataset.mode === 'delivery' ? 'delivery' : 'pickup'; if (state.deliveryMode === 'delivery' && !state.selectedRiderId) state.selectedRiderId = nearestAvailableRiders()[0]?.id || ''; render(); }
      else if (action === 'use-location') requestCustomerLocation();
      else if (action === 'select-rider-for-delivery') {
        const selected = nearestAvailableRiders().find(entry => entry.id === button.dataset.id);
        if (!totalQty()) { showToast('Add an item before choosing a delivery rider.'); return; }
        if (!selected) { showToast('That rider is no longer available within your location range. Refresh your location or choose another rider.'); render(); return; }
        state.deliveryMode = 'delivery';
        state.selectedRiderId = selected.id;
        navigate('/checkout');
      }
      else if (action === 'add' || action === 'increase') changeCart(button.dataset.id, 1);
      else if (action === 'decrease') changeCart(button.dataset.id, -1);
      else if (action === 'checkout') {
        if (!totalQty()) { showToast('Add food to your order first.'); return; }
        if (!state.user) openSignIn('checkout'); else navigate('/checkout');
      } else if (action === 'place-order') {
        if (!state.user) { openSignIn('checkout'); return; }
        if (!totalQty()) { navigate('/menu?table=' + encodeURIComponent(state.currentTable)); return; }
        if (state.deliveryMode === 'delivery') {
          if (!state.customerLocation) { showToast('Use your current location to find the nearest rider.'); return; }
          if (!nearbySellerEntries().some(entry => entry.id === (cartProducts()[0]?.sellerId || 'juniper'))) { showToast('This seller is not within your configured delivery area. Choose pickup or a nearby kitchen.'); return; }
          if (!state.deliveryAddress.trim()) { showToast('Enter a delivery address or nearby landmark.'); document.getElementById('delivery-address')?.focus(); return; }
          const nearest = nearestAvailableRiders();
          const chosen = nearest.find(entry => entry.id === state.selectedRiderId) || nearest[0];
          if (!chosen) { showToast('No approved rider is available in this area. Choose pickup or try again later.'); return; }
          state.selectedRiderId = chosen.id;
        }
        const order = createOrder();
        navigate(`/pay/${encodeURIComponent(order.id)}?a=${Math.round(order.total)}&t=${encodeURIComponent(order.table)}&q=${order.quantity}&s=${encodeURIComponent(order.sellerId)}`);
      } else if (action === 'payment-method') { state.paymentMethod = button.dataset.method || 'qr'; render(); }
      else if (action === 'payment-submitted') submitPaymentNotice(button.dataset.id);
      else if (action === 'verify-payment') { if (isSeller()) verifyPayment(button.dataset.id); }
      else if (action === 'copy-menu-link' || action === 'copy-payment') copyText(button.dataset.link || '', action === 'copy-payment' ? 'Payment link copied.' : 'Table link copied.');
      else if (action === 'copy-bank' || action === 'copy-text') copyText(button.dataset.text || '', 'Details copied.');
      else if (action === 'share-whatsapp') shareToWhatsApp(button.dataset.link || '', button.dataset.message || 'Juniper payment link');
      else if (action === 'share-native') shareNative(button.dataset.link || '', button.dataset.message || 'Juniper payment link');
      else if (action === 'download-qr') downloadSvg(button.dataset.qrId, button.dataset.file || 'juniper-qr.svg');
      else if (action === 'new-food') { state.editingFood = 'new'; render(); }
      else if (action === 'cancel-food-edit') { state.editingFood = null; render(); }
      else if (action === 'edit-food') {
        const product = products.find(item => item.id === button.dataset.id);
        const wait = foodCooldownMs(product);
        if (wait) showToast(`This food can be edited again in ${prettyRemaining(wait)}.`);
        else { state.editingFood = button.dataset.id; render(); }
      } else if (action === 'approve-seller') {
        const index = Number(button.dataset.index), application = sellerApplications[index];
        if (!SELLER_VERIFICATION_READY || !application?.identityVerified) { showToast('Seller approval is blocked until secure identity verification is connected and the identity check passes.'); return; }
        if (application) {
          const account = approvedAccounts.find(item => item.email.toLowerCase() === application.email.toLowerCase());
          if (!account) { showToast('The buyer account could not be found.'); return; }
          let sellerId = `s${Date.now().toString(36).slice(-6)}${Math.random().toString(36).slice(2, 6)}`;
          while (sellerProfiles[sellerId]) sellerId = `s${Date.now().toString(36).slice(-6)}${Math.random().toString(36).slice(2, 6)}`;
          sellerProfiles[sellerId] = { id: sellerId, publicName: application.storeName, ownerName: application.legalName || account.name, ownerEmail: account.email, bio: application.bio, location: application.location, phone: application.phone || '', whatsapp: application.whatsapp || '', latitude: application.latitude || '', longitude: application.longitude || '', deliveryRadiusKm: Number(application.deliveryRadiusKm || 25), bankName: '', accountName: '', accountNumber: '', opayLink: '', walletLink: '' };
          Object.assign(account, { role: 'seller', sellerId, approved: true, sellerApprovedAt: new Date().toISOString() });
          sellerApplications.splice(index, 1);
          saveStore(STORAGE.seller, sellerProfiles); saveStore(STORAGE.accounts, approvedAccounts); saveStore(STORAGE.sellerApplications, sellerApplications);
          if (state.user?.email?.toLowerCase() === account.email.toLowerCase()) { state.user = { ...account }; saveStore(STORAGE.user, state.user); }
          render(); showToast('Seller mode approved. Seller tools are now enabled.');
        }
      } else if (action === 'deny-seller') {
        const application = sellerApplications[Number(button.dataset.index)];
        sellerApplications.splice(Number(button.dataset.index), 1); saveStore(STORAGE.sellerApplications, sellerApplications);
        render(); showToast(application ? 'Seller application declined. The buyer account remains active.' : 'Application removed.');
      } else if (action === 'approve-rider') {
        const index = Number(button.dataset.index), application = riderApplications[index];
        const account = application && approvedAccounts.find(item => item.email.toLowerCase() === application.email.toLowerCase());
        if (!application || !account) { showToast('The rider account could not be found.'); return; }
        let riderId = `r${Date.now().toString(36).slice(-6)}${Math.random().toString(36).slice(2, 6)}`;
        while (riderProfiles[riderId]) riderId = `r${Date.now().toString(36).slice(-6)}${Math.random().toString(36).slice(2, 6)}`;
        riderProfiles[riderId] = { id: riderId, ownerEmail: account.email, name: application.name, phone: application.phone, whatsapp: application.whatsapp, vehicle: application.vehicle, serviceArea: application.serviceArea, latitude: application.latitude, longitude: application.longitude, serviceRadiusKm: Number(application.serviceRadiusKm || 20), baseFee: Number(application.baseFee || 0), active: true, available: true, approvedAt: new Date().toISOString() };
        account.riderId = riderId;
        riderApplications.splice(index, 1);
        saveStore(STORAGE.riders, riderProfiles); saveStore(STORAGE.riderApplications, riderApplications); saveStore(STORAGE.accounts, approvedAccounts);
        if (state.user?.email?.toLowerCase() === account.email.toLowerCase()) { state.user = { ...account }; saveStore(STORAGE.user, state.user); }
        pushNotification({ email: account.email, type: 'rider-status', riderId, message: 'Your rider application was approved. Your public rider profile is active.' });
        render(); showToast('Rider profile approved and activated.');
      } else if (action === 'deny-rider') {
        const application = riderApplications[Number(button.dataset.index)];
        riderApplications.splice(Number(button.dataset.index), 1); saveStore(STORAGE.riderApplications, riderApplications);
        render(); showToast(application ? 'Rider application declined. The customer account remains active.' : 'Application removed.');
      } else if (action === 'revoke-account') {
        const account = approvedAccounts[Number(button.dataset.index)];

          approvedAccounts.splice(Number(button.dataset.index), 1); saveStore(STORAGE.accounts, approvedAccounts);
          if (state.user?.email?.toLowerCase() === account.email.toLowerCase()) { state.user = null; saveStore(STORAGE.user, null); }
          render(); showToast('Account access revoked.');
        }
      }

    app.addEventListener('input', event => {

        state.menuSearch = event.target.value;

        const input = document.getElementById('menu-search');
        if (input) { input.focus(); input.setSelectionRange(position, position); }
      }
      if (event.target.id === 'rider-search') {
        state.riderSearch = event.target.value;
        const position = event.target.selectionStart;
        render();
        const input = document.getElementById('rider-search');
        if (input) { input.focus(); input.setSelectionRange(position, position); }
      }
    });
    app.addEventListener('change', event => {
      if (event.target.id === 'business-table') { state.businessTable = event.target.value; render(); }
    });
    app.addEventListener('submit', event => {
      const formId = event.target.id;
      if (!['signin-form','request-account-form','seller-application-form','food-form','seller-profile-form','payment-settings-form','payment-request-form','category-form','review-form','receipt-form','rider-application-form','rider-review-form'].includes(formId)) return;
      event.preventDefault();
      const form = new FormData(event.target);
      if (formId === 'receipt-form') { shareReceiptWithSeller(String(form.get('orderId') || ''), form.get('receipt')); return; }
      if (formId === 'signin-form') {
        const email = String(form.get('email') || '').trim().toLowerCase();
        const account = approvedAccounts.find(item => item.email.toLowerCase() === email && item.approved !== false);
        if (!account) {
          state.modalMessage = 'No buyer account matches that email. Create a buyer account to continue.';
          render();
          return;
        }
        const user = { ...account, email, approved: true };
        state.user = user; saveStore(STORAGE.user, user);
        const pending = state.pendingAction;
        state.modal = false; state.pendingAction = null; state.modalMessage = '';
        render(); showToast(`Welcome, ${user.name.split(/\s+/)[0]} — you're signed in.`);
        if (pending === 'checkout') setTimeout(() => navigate('/checkout'), 40);
        return;
      }
      if (formId === 'request-account-form') {
        const name = String(form.get('name') || '').trim();
        const email = String(form.get('email') || '').trim().toLowerCase();
        if (!name || !email) return;
        const existing = approvedAccounts.find(item => item.email.toLowerCase() === email);
        if (existing) {
          state.modalMode = 'signin'; state.modalMessage = 'This email already has an account. Sign in to continue.'; render(); return;

        const account = { name, email, role: 'buyer', approved: true, createdAt: new Date().toISOString() };
        approvedAccounts.unshift(account); saveStore(STORAGE.accounts, approvedAccounts);
        state.user = { ...account }; saveStore(STORAGE.user, state.user);
        const pending = state.pendingAction;
        state.modal = false; state.pendingAction = null; state.modalMessage = ''; render();
        showToast(`Buyer account created. Welcome, ${name.split(/\s+/)[0]}!`);
        if (pending === 'checkout') setTimeout(() => navigate('/checkout'), 40);
        return;
      }
      if (formId === 'seller-application-form') {
        if (!state.user || isSeller()) { showToast('Sign in with a buyer account before applying for seller mode.'); return; }
        const email = state.user.email.toLowerCase();
        const duplicate = sellerApplications.find(application => application.email.toLowerCase() === email);
        if (duplicate) {
          state.modal = false; render(); showToast('Your seller application is already awaiting review.'); return;
        }
        const legalName = String(form.get('legalName') || '').trim();
        const storeName = String(form.get('storeName') || '').trim();
        const businessAddress = String(form.get('businessAddress') || '').trim();
        const location = String(form.get('location') || '').trim();
        const bio = String(form.get('bio') || '').trim();
        const phone = safePhone(form.get('phone'));
        const whatsapp = safePhone(form.get('whatsapp'));
        const latitude = String(form.get('latitude') || '').trim();
        const longitude = String(form.get('longitude') || '').trim();
        const deliveryRadiusKm = Number(form.get('deliveryRadiusKm') || 25);
        const passportPhoto = form.get('passportPhoto');
        const profilePhoto = form.get('profilePhoto');
        const isImageFile = file => Boolean(file && typeof file.size === 'number' && file.size > 0 && /^image\//i.test(String(file.type || '')));
        if (!legalName || !storeName || !businessAddress || !location || !bio || !Number.isFinite(deliveryRadiusKm) || deliveryRadiusKm < 1 || deliveryRadiusKm > 200) { showToast('Complete the required seller details and choose a valid delivery radius.'); return; }
        if (!isImageFile(passportPhoto) || !isImageFile(profilePhoto)) { showToast('Select an image for both the passport-photo and seller-profile fields. No image will be uploaded in this preview.'); return; }
        if (passportPhoto.size > 8 * 1024 * 1024 || profilePhoto.size > 8 * 1024 * 1024) { showToast('For this preview, each selected image must be 8 MB or smaller.'); return; }
        if (!phone && !whatsapp) { showToast('Add a phone number or WhatsApp number for customer contact.'); return; }
        if ((latitude || longitude) && !validCoordinates(latitude, longitude)) { showToast('Add both valid map coordinates, or leave both blank.'); return; }
        sellerApplications.unshift({ name: legalName, legalName, buyerName: state.user.name, email, storeName, businessAddress, location, bio, phone, whatsapp, latitude, longitude, deliveryRadiusKm, passportPhotoSelectedLocally: true, profilePhotoSelectedLocally: true, secureFilesReceived: false, createdAt: new Date().toISOString() });
        saveStore(STORAGE.sellerApplications, sellerApplications);
        state.sellerApplicationLocation = null; state.modal = false; state.modalMessage = ''; render();
        showToast('Seller application submitted. Your buyer account remains active.');
        return;
      }
      if (formId === 'rider-application-form') {
        if (!state.user) { showToast('Sign in before applying for rider access.'); return; }
        if (isRider()) { showToast('This account already has an active rider profile.'); return; }
        if (riderApplications.some(application => application.email.toLowerCase() === state.user.email.toLowerCase())) { showToast('Your rider application is already awaiting review.'); return; }
        const name = String(form.get('name') || '').trim();
        const phone = safePhone(form.get('phone'));
        const whatsapp = safePhone(form.get('whatsapp'));
        const vehicle = String(form.get('vehicle') || '').trim();
        const serviceArea = String(form.get('serviceArea') || '').trim();
        const latitude = String(form.get('latitude') || '').trim();
        const longitude = String(form.get('longitude') || '').trim();
        const serviceRadiusKm = Number(form.get('serviceRadiusKm'));
        const baseFeeValue = Number(form.get('baseFee'));
        if (!name || !phone || !vehicle || !serviceArea || !validCoordinates(latitude, longitude) || !Number.isFinite(serviceRadiusKm) || serviceRadiusKm < 1 || serviceRadiusKm > 100 || !Number.isFinite(baseFeeValue) || baseFeeValue < 0) { showToast('Complete the rider details, add a valid map pin, and use a valid radius and fee.'); return; }
        const baseFee = Math.round(baseFeeValue);
        riderApplications.unshift({ name, email: state.user.email.toLowerCase(), phone, whatsapp, vehicle, serviceArea, latitude, longitude, serviceRadiusKm, baseFee, createdAt: new Date().toISOString() });
        saveStore(STORAGE.riderApplications, riderApplications); state.riderApplicationLocation = null; render(); showToast('Rider application submitted for admin review.');
        return;
      }
      if (formId === 'food-form') {
        if (!isSeller()) { showToast('Verified seller mode is required to edit menu listings.'); return; }
        const id = String(form.get('foodId') || '');
        const existing = id ? products.find(item => item.id === id) : null;
        if (existing && foodCooldownMs(existing)) { showToast(`This food can be edited again in ${prettyRemaining(foodCooldownMs(existing))}.`); return; }
        const chosenCategory = String(form.get('category') || '').trim();
        const category = categoriesForSeller().includes(chosenCategory) ? chosenCategory : 'Bowls';
        const details = {
          name: String(form.get('name') || '').trim(), category, price: Math.round(Number(form.get('price') || 0)),
          description: String(form.get('description') || '').trim(), ingredients: String(form.get('ingredients') || '').trim(),
          allergens: String(form.get('allergens') || '').trim(), prepTime: String(form.get('prepTime') || '').trim(),
          badge: String(form.get('badge') || '').trim() || category, art: categoryArtFor(category), sellerId: currentSellerId(), published: true
        };
        if (!details.name || !details.description || details.price < 100) { showToast('Add a name, description and valid price.'); return; }
        if (existing) Object.assign(existing, details, { lastEditedAt: new Date().toISOString() });
        else {
          const newListing = { ...details, id: `food-${Date.now()}`, createdAt: new Date().toISOString(), lastEditedAt: null };
          products.unshift(newListing);
          notifyTaggedCustomers(currentSellerId(), newListing);
        }
        saveStore(STORAGE.foods, products); state.editingFood = null; render(); showToast(existing ? 'Menu item details saved. Editing unlocks again in two hours.' : 'Menu item published. Tagged customers can see an update.');
        return;
      }
      if (formId === 'seller-profile-form') {
        if (!isSeller()) return;
        const profile = currentSellerProfile();
        const phone = safePhone(form.get('phone'));
        const whatsapp = safePhone(form.get('whatsapp'));
        const latitude = String(form.get('latitude') || '').trim();
        const longitude = String(form.get('longitude') || '').trim();
        const deliveryRadiusKm = Number(form.get('deliveryRadiusKm') || 25);
        if (!phone && !whatsapp) { showToast('Add a phone number or WhatsApp number for customer contact.'); return; }
        if ((latitude || longitude) && !validCoordinates(latitude, longitude)) { showToast('Add both valid map coordinates, or leave both blank.'); return; }
        if (!Number.isFinite(deliveryRadiusKm) || deliveryRadiusKm < 1 || deliveryRadiusKm > 200) { showToast('Choose a valid delivery radius between 1 and 200 km.'); return; }
        Object.assign(profile, {
          publicName: String(form.get('publicName') || '').trim(), ownerName: String(form.get('ownerName') || '').trim(), ownerEmail: state.user.email,
          location: String(form.get('location') || '').trim(), bio: String(form.get('bio') || '').trim(), phone, whatsapp, latitude, longitude, deliveryRadiusKm
        });
        sellerProfiles[currentSellerId()] = profile; saveStore(STORAGE.seller, sellerProfiles); render(); showToast('Public seller profile and contact details updated.');
        return;
      }
      if (formId === 'payment-settings-form') {
        if (!isSeller()) return;
        const profile = currentSellerProfile();
        profile.bankName = String(form.get('bankName') || '').trim();
        profile.accountName = String(form.get('accountName') || '').trim();
        profile.accountNumber = String(form.get('accountNumber') || '').replace(/\D/g, '').slice(0, 20);
        profile.opayLink = safeWebLink(form.get('opayLink'));
        profile.walletLink = safeWebLink(form.get('walletLink'));
        sellerProfiles[currentSellerId()] = profile; saveStore(STORAGE.seller, sellerProfiles); render(); showToast('Seller payment options saved.');
        return;
      }
      if (formId === 'category-form') {
        if (!isSeller()) return;
        const name = String(form.get('categoryName') || '').trim().replace(/\s+/g, ' ');
        if (!name) return;
        if (categoriesForSeller().some(category => category.toLowerCase() === name.toLowerCase())) { showToast('That category already exists for this seller.'); return; }
        sellerCategories.push({ name, sellerId: currentSellerId(), createdAt: new Date().toISOString() });
        saveStore(STORAGE.categories, sellerCategories); render(); showToast(`Category “${name}” added. Use it on any food listing.`);
        return;
      }
      if (formId === 'payment-request-form') {
        if (!isSeller()) return;
        const amount = Math.round(Number(form.get('amount') || 0));
        if (amount < 100) { showToast('Enter a payment amount of at least ₦100.'); return; }
        const order = createPaymentRequest(amount, form.get('note'));
        state.paymentMethod = 'qr'; render(); showToast(`Payment QR created for ${money(order.total)}.`);
        return;
      }
      if (formId === 'review-form') {
        if (!state.user?.approved) { openSignIn(); return; }
        const product = products.find(item => item.id === state.route.id);
        if (!product) return;
        const comment = String(form.get('comment') || '').trim();
        const rating = Math.max(1, Math.min(5, Number(form.get('rating') || state.selectedRating || 5)));
        if (!comment) { showToast('Add a short comment before posting.'); return; }
        const list = productReviews(product.id);
        const old = list.find(item => item.email?.toLowerCase() === state.user.email.toLowerCase());
        const entry = { name: state.user.name, email: state.user.email, rating, comment, createdAt: new Date().toISOString() };
        if (old) Object.assign(old, entry); else list.unshift(entry);
        reviews[product.id] = list; saveStore(STORAGE.reviews, reviews); render(); showToast('Your food review is posted.');
        return;
      }
      if (formId === 'rider-review-form') {
        if (!state.user) { openSignIn(); return; }
        const riderId = String(form.get('riderId') || '');
        if (!riderProfiles[riderId]?.active || state.user.riderId === riderId) return;
        const comment = String(form.get('comment') || '').trim();
        const rating = Math.max(1, Math.min(5, Number(form.get('rating') || state.selectedRiderRating || 5)));
        if (!comment) { showToast('Add a short comment before posting.'); return; }
        const list = riderReviewsFor(riderId);
        const old = list.find(item => item.email?.toLowerCase() === state.user.email.toLowerCase());
        const entry = { name: state.user.name, email: state.user.email, rating, comment, createdAt: new Date().toISOString() };
        if (old) Object.assign(old, entry); else list.unshift(entry);
        riderReviews[riderId] = list; saveStore(STORAGE.riderReviews, riderReviews); render(); showToast('Your rider review is posted.');
      }
    });

    async function copyText(text, message) {
      try {
        await navigator.clipboard.writeText(text);
        showToast(message);
      } catch {
        window.prompt('Copy this link', text);
      }
    }
    function shareToWhatsApp(link, message) {
      const text = `${message || 'Juniper payment link'}\n${link}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank', 'noopener,noreferrer');
    }
    async function shareNative(link, message) {
      if (navigator.share) {
        try { await navigator.share({ title: 'Juniper payment link', text: message, url: link }); }
        catch (error) { if (error.name !== 'AbortError') copyText(link, 'Payment link copied.'); }
      } else copyText(link, 'Payment link copied.');
    }
    function downloadSvg(id, filename) {
      const svg = document.getElementById(id);
      if (!svg) { showToast('QR code is not available.'); return; }
      const source = new XMLSerializer().serializeToString(svg);
      const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url; anchor.download = filename || 'juniper-qr.svg';
      document.body.appendChild(anchor); anchor.click(); anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('QR code downloaded as SVG.');
    }

    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
