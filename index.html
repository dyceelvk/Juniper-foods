<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8f9f5" />
  <meta name="description" content="Browse independent food sellers, scan payment QR codes, and pay by bank transfer, OPay or a connected wallet." />
  <title>Juniper — food, pay, go</title>
  <style>
    :root {
      --ink: #1d2b24;
      --forest: #193d31;
      --forest-2: #254c3c;
      --leaf: #4e7656;
      --lime: #dff08c;
      --paper: #f8f9f5;
      --white: #ffffff;
      --line: #e5e9e0;
      --muted: #78847a;
      --soft: #edf1e8;
      --orange: #e9a779;
      --shadow: 0 20px 60px rgba(30, 54, 39, .10);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }
    .container { width: min(1160px, calc(100% - 48px)); margin: 0 auto; }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      height: 78px; padding: 0 max(24px, calc((100vw - 1160px) / 2));
      display: flex; align-items: center; justify-content: space-between; gap: 28px;
      background: rgba(248, 249, 245, .94); border-bottom: 1px solid rgba(229, 233, 224, .82);
      backdrop-filter: blur(18px);
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 780; letter-spacing: -.7px; white-space: nowrap; }
    .brand-mark { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: var(--lime); color: var(--forest); }
    .brand-mark svg { width: 21px; height: 21px; }
    .brand small { display: block; color: #829085; font-size: 9px; font-weight: 700; letter-spacing: 1.15px; line-height: 1; margin-top: 3px; text-transform: uppercase; }
    .nav-links { display: flex; align-items: center; gap: 30px; margin-left: auto; margin-right: 8px; }
    .nav-links a { color: #56635a; font-size: 13px; font-weight: 620; transition: color .2s ease; }
    .nav-links a:hover { color: var(--forest); }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .btn {
      min-height: 44px; padding: 0 18px; border: 1px solid transparent; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      font-size: 13px; font-weight: 730; letter-spacing: -.1px; transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { color: white; background: var(--forest); box-shadow: 0 7px 18px rgba(25, 61, 49, .14); }
    .btn-primary:hover { background: #245442; box-shadow: 0 10px 22px rgba(25, 61, 49, .18); }
    .btn-light { background: white; color: var(--forest); border-color: var(--line); }
    .btn-light:hover { border-color: #c6d3c7; background: #fff; }
    .btn-lime { background: var(--lime); color: var(--forest); }
    .btn-lime:hover { background: #d4e77a; }
    .btn-ghost { border-color: transparent; color: var(--forest); background: transparent; padding-left: 12px; padding-right: 12px; }
    .btn-ghost:hover { background: #eef2e9; }
    .btn-danger { color: #8a443d; background: #fbefec; border-color: #f2ded8; }
    .btn-wide { width: 100%; }
    .btn svg { width: 16px; height: 16px; }
    .user-chip { height: 40px; padding: 0 12px 0 6px; border: 1px solid var(--line); border-radius: 99px; background: white; display: inline-flex; align-items: center; gap: 8px; color: var(--forest); font-size: 12px; font-weight: 720; }
    .user-avatar { width: 27px; height: 27px; border-radius: 50%; display: grid; place-items: center; background: var(--lime); font-size: 11px; font-weight: 820; }
    .updates-control { position: relative; min-width: 38px; height: 38px; padding: 0 11px; border: 1px solid var(--line); border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; background: white; color: var(--forest); font-size: 10px; font-weight: 750; }
    .updates-control svg { width: 16px; height: 16px; }
    .updates-count { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; display: grid; place-items: center; background: #d36647; color: white; font-size: 8px; }
    .tag-action-row { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin-top: 11px; }
    .tag-button { min-height: 36px; padding: 0 13px; border: 1px solid #dce6d5; border-radius: 99px; display: inline-flex; align-items: center; gap: 7px; background: #f4f8ee; color: #456846; font-size: 10px; font-weight: 760; }
    .tag-button svg { width: 15px; height: 15px; }
    .tag-count-label { color: #778477; font-size: 10px; }
    .notification-list { display: grid; gap: 10px; }
    .notification-card { padding: 15px 17px; border: 1px solid #e5ebe1; border-radius: 14px; background: #fff; }
    .notification-card.unread { border-color: #cdddbd; background: #f8fbf4; }
    .notification-card p { margin: 7px 0; color: #69756b; font-size: 11px; line-height: 1.55; }
    .notification-card small { color: #8a958a; font-size: 9px; }
    .notification-card a { display: inline-flex; margin: 7px 10px 0 0; color: #4c704d; font-size: 10px; font-weight: 750; }
    .rider-application-form { max-width:760px; margin:18px auto; display:grid; gap:12px; }
    .rider-order-list { display:grid; gap:10px; }
    .rider-order-card { padding:15px; border:1px solid #e5ebe1; border-radius:14px; background:#fff; }
    .rider-order-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .rider-order-card p { margin:8px 0 5px; color:#68766a; font-size:10px; }
    .rider-order-card small { color:#879287; font-size:9px; line-height:1.55; }
    .rider-order-actions,.rider-header-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .rider-header-actions { align-items:center; }
    .rider-directory { padding: 28px 0 68px; }
    .rider-directory-tools { display:grid; grid-template-columns:minmax(240px,1fr) auto; gap:12px; align-items:center; margin:18px 0; }
    .rider-directory-tools .search-wrap { width:100%; }
    .rider-directory-results { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; }
    .rider-search-card { padding:18px; border:1px solid var(--line); border-radius:17px; background:#fff; display:grid; gap:10px; }
    .rider-search-card h3 { margin:0; font-size:17px; letter-spacing:-.4px; }
    .rider-search-card p { margin:0; color:#6f7b71; font-size:11px; line-height:1.55; }
    .rider-search-card small { color:#849084; font-size:10px; }
    .rider-search-card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .rider-search-card-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:3px; }
    .rider-status-pill { width:max-content; padding:5px 9px; border-radius:99px; background:#edf5e5; color:#4f7044; font-size:9px; font-weight:800; }
    .rider-status-pill.outside { background:#fff4e9; color:#9a6330; }
    .rider-directory-note { margin:12px 0 0; color:#78847a; font-size:11px; line-height:1.6; }
    .mobile-menu-link { display: none; }

    /* Home */
    .hero { display: grid; grid-template-columns: 1.03fr .97fr; align-items: center; gap: 54px; padding: 58px 0 84px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--leaf); font-size: 10px; font-weight: 800; letter-spacing: 1.35px; text-transform: uppercase; }
    .eyebrow-dot { width: 7px; height: 7px; border-radius: 50%; background: #87a653; box-shadow: 0 0 0 4px #e8efd7; }
    .hero h1 { max-width: 560px; margin: 20px 0 20px; color: var(--ink); font-size: clamp(48px, 5.35vw, 70px); line-height: .99; letter-spacing: -4.6px; font-weight: 720; }
    .hero h1 em { color: var(--leaf); font-style: normal; }
    .hero-copy > p { max-width: 500px; margin: 0; color: #657168; font-size: 16px; line-height: 1.75; }
    .hero-actions { display: flex; align-items: center; gap: 12px; margin-top: 29px; flex-wrap: wrap; }
    .hero-actions .btn { min-height: 49px; padding: 0 21px; }
    .trust-note { display: flex; align-items: center; gap: 9px; margin-top: 25px; color: #738075; font-size: 11px; font-weight: 600; }
    .trust-note .tiny-check { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; background: #e9f0dc; color: var(--leaf); font-size: 12px; font-weight: 800; }
    .hero-stage { position: relative; min-height: 478px; overflow: hidden; border-radius: 32px; background: #e9eee4; isolation: isolate; }
    .hero-stage:before { content: ""; position: absolute; z-index: -1; width: 400px; height: 400px; right: -90px; top: -165px; border-radius: 50%; background: #dfe9d8; }
    .hero-stage:after { content: ""; position: absolute; z-index: -1; width: 310px; height: 310px; left: -145px; bottom: -176px; border-radius: 50%; border: 1px solid rgba(64, 103, 70, .12); box-shadow: 0 0 0 24px rgba(64, 103, 70, .035), 0 0 0 50px rgba(64, 103, 70, .028); }
    .stage-label { position: absolute; right: 27px; top: 26px; display: flex; align-items: center; gap: 7px; color: #778275; font-size: 10px; font-weight: 720; letter-spacing: .6px; text-transform: uppercase; }
    .stage-label span { width: 7px; height: 7px; border-radius: 50%; background: #789a54; }
    .hero-qr-card { position: absolute; top: 66px; left: 8.5%; width: 260px; padding: 17px 17px 16px; border-radius: 21px; background: #fff; box-shadow: 0 24px 55px rgba(31, 59, 42, .16); transform: rotate(-3deg); }
    .hero-qr-head { display: flex; align-items: center; justify-content: space-between; padding: 0 3px 13px; color: #26362c; }
    .hero-qr-brand { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 790; letter-spacing: -.3px; }
    .hero-qr-brand .mini-logo { display: grid; place-items: center; width: 21px; height: 21px; border-radius: 7px; color: var(--forest); background: var(--lime); }
    .hero-qr-brand .mini-logo svg { width: 14px; height: 14px; }
    .dots { color: #a8afa8; letter-spacing: 2px; font-size: 13px; }
    .hero-qr-link { display: block; padding: 13px 0 5px; text-align: center; border: 1px solid #edf0eb; border-radius: 14px; }
    .hero-qr-link svg { width: 170px; height: 170px; margin: 0 auto; }
    .qr-caption { margin-top: 6px; color: var(--forest); font-size: 11px; font-weight: 780; letter-spacing: .9px; }
    .qr-subcaption { margin: 4px 0 10px; color: #919b91; font-size: 10px; }
    .hero-qr-foot { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px 0; color: #7b867d; font-size: 9px; font-weight: 650; }
    .hero-qr-foot strong { color: #456b4d; }
    .floating-order { position: absolute; right: 7%; bottom: 34px; width: 235px; padding: 15px; border: 1px solid rgba(255,255,255,.8); border-radius: 18px; background: rgba(255,255,255,.93); box-shadow: 0 18px 45px rgba(31, 59, 42, .13); backdrop-filter: blur(12px); transform: rotate(2.2deg); }
    .floating-order-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
    .floating-order-top strong { font-size: 11px; }
    .ready-pill { padding: 5px 8px; border-radius: 99px; background: #edf4df; color: #557543; font-size: 8px; font-weight: 770; }
    .float-line { display: flex; align-items: center; gap: 10px; }
    .float-dish { width: 37px; height: 37px; border-radius: 11px; display: grid; place-items: center; background: #f3e7d9; font-size: 20px; }
    .float-line b { display: block; color: #35443a; font-size: 10px; }
    .float-line small { display: block; margin-top: 4px; color: #8b958c; font-size: 9px; }
    .float-price { margin-left: auto; color: #34473b; font-size: 10px; font-weight: 770; }
    .scan-hint { position: absolute; left: 50%; bottom: 27px; transform: translateX(-50%); color: #748273; font-size: 10px; font-weight: 650; white-space: nowrap; }
    .scan-hint span { margin-right: 5px; color: #5c8055; }
    .logo-row { display: flex; align-items: center; gap: 18px; margin-top: 48px; color: #899389; font-size: 10px; font-weight: 720; }
    .avatar-stack { display: flex; margin-left: 2px; }
    .avatar-stack span { width: 25px; height: 25px; margin-left: -6px; border: 2px solid var(--paper); border-radius: 50%; display: grid; place-items: center; background: #e1c4a6; color: #675442; font-size: 9px; font-weight: 800; }
    .avatar-stack span:nth-child(2) { background: #c2d3b4; color: #45634a; }
    .avatar-stack span:nth-child(3) { background: #e8c1ad; color: #815443; }
    .logo-row b { color: #566459; }
    .section { padding: 76px 0; }
    .section-heading { max-width: 610px; margin: 0 auto 38px; text-align: center; }
    .section-heading h2 { margin: 13px 0 11px; font-size: clamp(31px, 3.5vw, 44px); line-height: 1.08; letter-spacing: -2px; }
    .section-heading p { margin: 0; color: #748076; font-size: 14px; line-height: 1.7; }
    .how-section { background: #fff; border-top: 1px solid #eff1eb; border-bottom: 1px solid #eff1eb; }
    .steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .step-card { position: relative; min-height: 202px; padding: 24px; border: 1px solid #ebeee7; border-radius: 20px; background: #fcfcfa; }
    .step-number { color: #84927f; font-size: 10px; font-weight: 800; letter-spacing: 1px; }
    .step-icon { width: 42px; height: 42px; margin: 22px 0 16px; border-radius: 14px; display: grid; place-items: center; background: #edf3e5; color: var(--leaf); }
    .step-icon svg { width: 21px; height: 21px; }
    .step-card h3 { margin: 0 0 8px; font-size: 16px; letter-spacing: -.4px; }
    .step-card p { max-width: 290px; margin: 0; color: #7b867c; font-size: 12px; line-height: 1.7; }
    .step-arrow { position: absolute; right: 20px; top: 27px; color: #b1b9af; font-size: 18px; }
    .preview-section { padding-bottom: 90px; }
    .preview-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 28px; }
    .preview-head .section-heading { margin: 0; text-align: left; }
    .preview-head .section-heading h2 { margin-bottom: 0; }
    .preview-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 17px; }
    .preview-card { overflow: hidden; border: 1px solid var(--line); border-radius: 19px; background: white; }
    .preview-art { height: 190px; overflow: hidden; }
    .preview-art svg { width: 100%; height: 100%; }
    .preview-meta { padding: 15px 17px 16px; }
    .preview-meta .food-type { color: #849184; font-size: 9px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; }
    .preview-meta h3 { margin: 7px 0 9px; font-size: 15px; letter-spacing: -.35px; }
    .preview-meta strong { color: var(--forest); font-size: 13px; }
    .home-cta { margin: 0 0 84px; padding: 36px 38px; border-radius: 25px; display: flex; align-items: center; justify-content: space-between; gap: 26px; background: var(--forest); color: white; }
    .home-cta h2 { margin: 0 0 9px; font-size: 28px; letter-spacing: -1.2px; }
    .home-cta p { margin: 0; color: #c0d1c5; font-size: 13px; line-height: 1.6; }
    .site-footer { padding: 26px 0 31px; border-top: 1px solid var(--line); }
    .footer-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; color: #879187; font-size: 10px; }
    .footer-row .brand { color: var(--ink); font-size: 15px; }
    .footer-links { display: flex; gap: 20px; }
    .footer-links a:hover { color: var(--forest); }

    /* Customer menu */
    .app-main { padding: 33px 0 72px; }
    .store-banner { padding: 25px 0 23px; display: flex; align-items: end; justify-content: space-between; gap: 24px; }
    .store-kicker { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 99px; background: #edf3e5; color: #527249; font-size: 9px; font-weight: 800; letter-spacing: .65px; text-transform: uppercase; }
    .store-kicker .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #729454; }
    .store-banner h1 { margin: 14px 0 8px; font-size: clamp(32px, 4vw, 43px); letter-spacing: -2.2px; line-height: 1.05; }
    .store-banner p { margin: 0; color: #7c877d; font-size: 13px; }
    .store-info { display: flex; align-items: center; gap: 18px; color: #6f7d71; font-size: 11px; font-weight: 600; }
    .store-info span { display: inline-flex; align-items: center; gap: 6px; }
    .store-info svg { width: 15px; height: 15px; color: #6c8961; }
    .menu-controls { margin: 22px 0 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .category-tabs { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .category-btn { height: 37px; padding: 0 15px; border: 1px solid #e3e8df; border-radius: 99px; background: transparent; color: #69766a; font-size: 11px; font-weight: 670; }
    .category-btn.active { border-color: var(--forest); background: var(--forest); color: white; }
    .search-wrap { position: relative; width: 222px; }
    .search-wrap svg { position: absolute; left: 13px; top: 50%; width: 15px; height: 15px; color: #8c968c; transform: translateY(-50%); pointer-events: none; }
    .search-wrap input { width: 100%; height: 39px; padding: 0 13px 0 38px; outline: none; border: 1px solid #e3e8df; border-radius: 99px; background: white; color: var(--ink); font-size: 11px; }
    .search-wrap input:focus { border-color: #9caf91; box-shadow: 0 0 0 3px #eaf0e3; }
    .menu-layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; align-items: start; gap: 24px; }
    .food-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .food-card { overflow: hidden; border: 1px solid #e7ebe3; border-radius: 19px; background: white; transition: transform .18s ease, box-shadow .18s ease; }
    .food-card:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(36, 61, 43, .07); }
    .food-art { position: relative; height: 184px; overflow: hidden; background: #ecefe7; }
    .food-art svg { width: 100%; height: 100%; }
    .food-badge { position: absolute; left: 12px; top: 12px; padding: 6px 8px; border-radius: 99px; background: rgba(255,255,255,.88); color: #637362; font-size: 8px; font-weight: 820; letter-spacing: .55px; text-transform: uppercase; backdrop-filter: blur(6px); }
    .food-content { padding: 14px 15px 14px; }
    .food-content h3 { margin: 0 0 5px; color: #27362d; font-size: 14px; letter-spacing: -.35px; }
    .food-content p { min-height: 32px; margin: 0; color: #828d82; font-size: 10px; line-height: 1.55; }
    .food-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; }
    .food-price { color: var(--forest); font-size: 13px; font-weight: 790; }
    .add-button { width: 35px; height: 35px; border: 1px solid #dce6d5; border-radius: 12px; display: grid; place-items: center; background: #f2f7eb; color: #3f6847; font-size: 20px; font-weight: 500; line-height: 1; transition: background .18s ease, transform .18s ease; }
    .add-button:hover { background: #e2edcf; transform: scale(1.04); }
    .add-button.added { width: auto; min-width: 35px; padding: 0 9px; font-size: 11px; font-weight: 760; }
    .cart-panel { position: sticky; top: 99px; overflow: hidden; border: 1px solid #e4e9e1; border-radius: 20px; background: white; box-shadow: 0 10px 32px rgba(29, 58, 39, .04); }
    .cart-head { padding: 18px 19px 16px; border-bottom: 1px solid #edf0eb; }
    .cart-head-row { display: flex; align-items: center; justify-content: space-between; }
    .cart-head h2 { margin: 0; font-size: 15px; letter-spacing: -.4px; }
    .cart-count { min-width: 23px; height: 23px; padding: 0 7px; border-radius: 99px; display: grid; place-items: center; background: #eef3e7; color: var(--forest); font-size: 10px; font-weight: 800; }
    .table-line { margin-top: 10px; display: flex; align-items: center; gap: 6px; color: #879187; font-size: 10px; }
    .table-line svg { width: 13px; height: 13px; color: #69855d; }
    .cart-body { padding: 15px 19px; }
    .cart-empty { padding: 18px 9px 21px; text-align: center; }
    .cart-empty-icon { width: 49px; height: 49px; margin: 0 auto 13px; border-radius: 17px; display: grid; place-items: center; background: #f1f4ee; color: #77906b; }
    .cart-empty-icon svg { width: 22px; height: 22px; }
    .cart-empty strong { display: block; font-size: 12px; }
    .cart-empty p { max-width: 190px; margin: 7px auto 0; color: #929b91; font-size: 10px; line-height: 1.55; }
    .cart-item { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #f0f2ee; }
    .cart-item:last-child { border-bottom: 0; }
    .cart-item-name { color: #405046; font-size: 10px; font-weight: 700; }
    .cart-item-price { margin-top: 4px; color: #8b968c; font-size: 9px; }
    .qty-control { display: flex; align-items: center; gap: 8px; }
    .qty-control button { width: 24px; height: 24px; border: 1px solid #e2e8df; border-radius: 8px; background: white; color: #4f6d54; font-size: 15px; line-height: 1; }
    .qty-control span { min-width: 9px; color: #46544a; font-size: 10px; font-weight: 730; text-align: center; }
    .cart-totals { padding: 14px 19px 18px; border-top: 1px solid #edf0eb; background: #fcfdfa; }

    // Compact QR Model 2 encoder (byte mode, error correction level L, versions 1–5).
    // This keeps Juniper table and payment QR codes scannable without a CDN.
    function encodeQr(text) {
      const bytes = Array.from(new TextEncoder().encode(String(text)));
      const specs = [
        null,
        { data: 19, ecc: 7, align: [] },
        { data: 34, ecc: 10, align: [6, 18] },
        { data: 55, ecc: 15, align: [6, 22] },
        { data: 80, ecc: 20, align: [6, 26] },
        { data: 108, ecc: 26, align: [6, 30] }
      ];
      let version = 1;
      while (version <= 5 && 4 + 8 + bytes.length * 8 > specs[version].data * 8) version++;
      if (version > 5) throw new Error('This QR link is too long.');
      const spec = specs[version];
      const bitData = [];
      const pushBits = (value, length) => { for (let i = length - 1; i >= 0; i--) bitData.push((value >>> i) & 1); };
      pushBits(0b0100, 4); // byte mode
      pushBits(bytes.length, 8);
      bytes.forEach(byte => pushBits(byte, 8));
      const capacity = spec.data * 8;
      for (let i = 0; i < Math.min(4, capacity - bitData.length); i++) bitData.push(0);
      while (bitData.length % 8) bitData.push(0);
      const data = [];
      for (let i = 0; i < bitData.length; i += 8) {
        let byte = 0;
        for (let j = 0; j < 8; j++) byte = (byte << 1) | (bitData[i + j] || 0);
        data.push(byte);
      }
      for (let pad = 0; data.length < spec.data; pad++) data.push(pad % 2 === 0 ? 0xEC : 0x11);

      const gfExp = new Array(512), gfLog = new Array(256);
      let gfValue = 1;
      for (let i = 0; i < 255; i++) {
        gfExp[i] = gfValue; gfLog[gfValue] = i;
        gfValue <<= 1;
        if (gfValue & 0x100) gfValue ^= 0x11D;
      }
      for (let i = 255; i < 512; i++) gfExp[i] = gfExp[i - 255];
      const gfMul = (a, b) => (!a || !b) ? 0 : gfExp[gfLog[a] + gfLog[b]];
      let generator = [1];
      for (let i = 0; i < spec.ecc; i++) {
        const next = new Array(generator.length + 1).fill(0);
        for (let j = 0; j < generator.length; j++) {
          next[j] ^= generator[j];
          next[j + 1] ^= gfMul(generator[j], gfExp[i]);
        }
        generator = next;
      }
      const remainder = new Array(spec.ecc).fill(0);
      for (const byte of data) {
        const factor = byte ^ remainder[0];
        remainder.shift(); remainder.push(0);
        for (let i = 0; i < spec.ecc; i++) remainder[i] ^= gfMul(generator[i + 1], factor);
      }
      const codewords = data.concat(remainder);
      const size = version * 4 + 17;
      const matrix = Array.from({ length: size }, () => new Array(size).fill(false));
      const isFunction = Array.from({ length: size }, () => new Array(size).fill(false));
      const setFunction = (x, y, dark) => {
        if (x >= 0 && y >= 0 && x < size && y < size) { matrix[y][x] = !!dark; isFunction[y][x] = true; }
      };
      const finder = (cx, cy) => {
        for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
          const dist = Math.max(Math.abs(dx), Math.abs(dy));
          setFunction(cx + dx, cy + dy, dist !== 2 && dist !== 4);
        }
      };
      finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
      for (let i = 8; i < size - 8; i++) {
        setFunction(6, i, i % 2 === 0);
        setFunction(i, 6, i % 2 === 0);
      }
      for (const cy of spec.align) for (const cx of spec.align) {
        if (isFunction[cy][cx]) continue;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
          setFunction(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }
      }
      const mask = 0;
      const formatData = (1 << 3) | mask; // Error correction L = binary 01.
      let rem = formatData << 10;
      for (let bit = 14; bit >= 10; bit--) if ((rem >>> bit) & 1) rem ^= 0x537 << (bit - 10);
      const format = ((formatData << 10) | rem) ^ 0x5412;
      const fmt = (x, y, i) => setFunction(x, y, ((format >>> i) & 1) !== 0);
      for (let i = 0; i <= 5; i++) fmt(8, i, i);
      fmt(8, 7, 6); fmt(8, 8, 7); fmt(7, 8, 8);
      for (let i = 9; i < 15; i++) fmt(14 - i, 8, i);
      for (let i = 0; i < 8; i++) fmt(size - 1 - i, 8, i);
      for (let i = 8; i < 15; i++) fmt(8, size - 15 + i, i);
      setFunction(8, size - 8, true);

      const stream = [];
      codewords.forEach(byte => { for (let bit = 7; bit >= 0; bit--) stream.push((byte >>> bit) & 1); });
      let streamIndex = 0;
      for (let right = size - 1; right >= 1; right -= 2) {
        if (right === 6) right--;
        const upward = ((right + 1) & 2) === 0;
        for (let vert = 0; vert < size; vert++) {
          const y = upward ? size - 1 - vert : vert;
          for (let j = 0; j < 2; j++) {
            const x = right - j;
            if (!isFunction[y][x]) {
              const bit = streamIndex < stream.length ? stream[streamIndex++] : 0;
              const maskBit = (x + y) % 2 === 0;
              matrix[y][x] = Boolean(bit ^ (maskBit ? 1 : 0));
            }
          }
        }
      }
      return matrix;
    }
    function qrSvg(text, id, pixelSize = 180) {

        return `<svg id="${escapeHtml(id)}" xmlns="http://www.w3.org/2000/svg" width="${pixelSize}" height="${pixelSize}" viewBox="0 0 ${full} ${full}" shape-rendering="crispEdges" role="img" aria-label="Scannable QR code"><rect width="${full}" height="${full}" fill="#fff"/><path d="${path}" fill="#193d31"/></svg>`;
      } catch (error) {
        return `<div class="empty-results"><b>QR code unavailable</b><span>${escapeHtml(error.message)}</span></div>`;
      }
    }

    function parseRoute() {
      const raw = (location.hash || '#/').slice(1);
      const queryIndex = raw.indexOf('?');
      const pathAndId = queryIndex >= 0 ? raw.slice(0, queryIndex) : raw;
      const params = new URLSearchParams(queryIndex >= 0 ? raw.slice(queryIndex + 1) : '');
      const bits = pathAndId.split('/').filter(Boolean);
      state.route = { path: bits[0] ? `/${bits[0]}` : '/', id: bits[1] || '', params };
      if (state.route.path === '/menu') {
        state.currentTable = params.get('table') || state.currentTable || '08';
        state.menuSellerId = params.get('s') || 'all';
      }
      if (state.route.path === '/pay') state.currentTable = params.get('t') || state.currentTable || '08';
      if (state.route.path === '/rider' && state.route.id) state.route.path = '/rider-profile';
    }
    function navigate(route) { location.hash = route; }
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2500);
    }
    function changeCart(id, delta) {
      const target = products.find(product => product.id === id);
      const currentSeller = cartProducts()[0]?.sellerId;
      if (delta > 0 && target && currentSeller && currentSeller !== target.sellerId) {
        showToast('One checkout is for one seller. Finish this order before adding items from another kitchen.');
        return;
      }
      const next = { ...(state.cart || {}) };
      const qty = Number(next[id] || 0) + delta;
      if (qty <= 0) delete next[id]; else next[id] = qty;
      state.cart = next; saveStore(STORAGE.cart, state.cart); render();
    }
    function openSignIn(pending = null, mode = 'signin') {
      state.pendingAction = pending;
      state.modalMode = mode;
      state.modalMessage = '';
      state.modal = true;
      render();
      setTimeout(() => document.getElementById(mode === 'request' ? 'request-name' : 'signin-email')?.focus(), 30);
    }
    function closeModal() { state.modal = false; state.pendingAction = null; state.modalMessage = ''; render(); }
    function saveOrders() { state.orders = state.orders.slice(0, 50); saveStore(STORAGE.orders, state.orders); }
    function createOrder() {
      const items = cartProducts().map(product => ({ id: product.id, name: product.name, qty: product.qty, price: product.price }));
      const subtotal = items.reduce((sum, item) => sum + item.qty * item.price, 0);
      const sellerId = items[0]?.sellerId || 'juniper';
      const riderId = state.deliveryMode === 'delivery' ? state.selectedRiderId : '';
      const rider = riderProfiles[riderId];
      const deliveryFee = riderId ? Math.max(0, Math.round(Number(rider?.baseFee || 0))) : 0;
      const total = subtotal + deliveryFee;
      const id = `JN-${Date.now().toString().slice(-6)}`;
      const order = { id, items, subtotal, deliveryFee, total, quantity: items.reduce((sum, item) => sum + item.qty, 0), table: state.deliveryMode === 'delivery' ? 'Delivery' : (state.currentTable || '08'), sellerId, sellerName: publicSellerName(sellerId), user: state.user?.name || 'Guest', buyerEmail: state.user?.email || '', deliveryMode: state.deliveryMode, deliveryAddress: state.deliveryMode === 'delivery' ? state.deliveryAddress.trim() : '', riderId, riderName: rider?.name || '', deliveryStatus: riderId ? 'assigned' : 'pickup', paymentStatus: 'pending', status: 'Awaiting payment', createdAt: new Date().toISOString() };
      state.orders = [order, ...state.orders]; saveOrders();
      if (riderId) notifyOrderParties(order);
      return order;
    }
    function createPaymentRequest(amount, note) {
      const id = `JN-${Date.now().toString().slice(-6)}`;
      const cleanAmount = Math.max(0, Math.round(Number(amount || 0)));
      const order = { id, items: [], note: String(note || '').trim().slice(0, 60), total: cleanAmount, quantity: 1, table: '—', sellerId: currentSellerId(), user: 'Payment request', paymentStatus: 'pending', status: 'Awaiting payment', createdAt: new Date().toISOString(), request: true };
      state.orders = [order, ...state.orders]; saveOrders();

    }
    function findOrder(id) { return state.orders.find(order => order.id === id); }
    function getRouteOrder() {
      const stored = findOrder(state.route.id);
      if (stored) return stored;
      const params = state.route.params;
      const amount = Number(params.get('a') || 0);
      return {
        id: state.route.id || 'JN-PAY', items: [], note: params.get('n') || '', total: amount,
        quantity: Number(params.get('q') || 1), table: params.get('t') || '—', sellerId: params.get('s') || 'juniper', sellerName: String(params.get('n') || '').replace(/-/g, ' '),
        user: state.user?.name || 'Guest', paymentStatus: 'pending', status: 'Awaiting payment', createdAt: new Date().toISOString(), external: true, request: params.get('r') === '1' || !params.get('t')
      };
    }
    function updateOrder(orderId, changes) {
      let order = findOrder(orderId) || getRouteOrder();
      order = { ...order, ...changes, updatedAt: new Date().toISOString() };
      const index = state.orders.findIndex(item => item.id === orderId);
      if (index >= 0) state.orders[index] = order; else state.orders.unshift(order);
      saveOrders();
      return order;
    }
    function submitPaymentNotice(orderId) {
      updateOrder(orderId, { paymentStatus: 'verification', status: 'Payment submitted for verification' });
      render();
      showToast('Payment notice sent. The seller will verify the transfer.');
    }
    async function shareReceiptWithSeller(orderId, file) {
      if (!file || !file.name) { showToast('Choose a receipt image first.'); return; }
      const order = findOrder(orderId) || getRouteOrder();
      const profile = sellerFor(order.sellerId);
      const message = `Payment receipt for order ${order.id} · ${money(order.total)} to ${profile.publicName}. Please confirm when received.`;
      if (navigator.share && navigator.canShare?.({ files: [file] })) {
        try {
          await navigator.share({ title: `Receipt for ${order.id}`, text: message, files: [file] });
          showToast('Receipt shared. The seller still needs to confirm the payment.');
          return;
        } catch (error) { if (error?.name === 'AbortError') return; }
      }
      const chat = whatsappHref(profile.whatsapp || profile.phone);
      if (chat) {
        window.open(`${chat}?text=${encodeURIComponent(message)}`, '_blank', 'noopener,noreferrer');

      } else showToast('This seller has no WhatsApp number. Use the share sheet or contact the seller directly.');
    }
    function verifyPayment(orderId) {

    function makePaymentRequestLink(order) {

    function renderHome() {

      return `${renderHeader('home')}
        <main>

          </section>

          <section class="how-section" id="how"><div class="container section"><div class="section-heading"><span class="eyebrow">Simple from the first scan</span><h2>From table to takeaway,<br />in three easy steps.</h2><p>Everything your guest needs, right in the browser they already have open.</p></div>
            <div class="steps-grid">
              <article class="step-card"><span class="step-number">01 / SCAN</span><span class="step-arrow">↗</span><span class="step-icon">${icon('qr')}</span><h3>Open a seller menu</h3><p>A table or shared payment QR opens the food, public seller profile, price and order details.</p></article>
              <article class="step-card"><span class="step-number">02 / PERSONALIZE</span><span class="step-arrow">↗</span><span class="step-icon">${icon('bag')}</span><h3>Choose a dish or drink</h3><p>Build an order with food, soft drinks or other beverages, then choose QR, bank transfer, OPay or another seller-enabled wallet.</p></article>
              <article class="step-card"><span class="step-number">03 / REPUTATION</span><span class="step-arrow">↗</span><span class="step-icon">${icon('shield')}</span><h3>Share honest feedback</h3><p>Customers can rate menu items, leave comments and help good kitchens earn trust.</p></article>
            </div>
          </div></section>

          <section class="container section preview-section" id="menu-preview"><div class="preview-head"><div class="section-heading"><span class="eyebrow">Food & drinks near you</span><h2>Good food, good people.</h2></div><a class="btn btn-light" href="#/menu?table=${table}">Explore the menu ${icon('arrow')}</a></div>
            <div class="preview-cards">${featured}</div>
          </section>
          <section class="container home-cta"><div><h2>Your next meal is one scan away.</h2><p>Find a dish, meet its seller and choose how to pay — from QR to bank transfer or OPay.</p></div><a class="btn btn-lime" href="#/menu?table=${table}">Browse menu ${icon('arrow')}</a></section>
        </main>
        <footer class="site-footer"><div class="container footer-row"><a class="brand" href="#/"><span class="brand-mark">${icon('leaf')}</span><span>juniper<small>food · pay · go</small></span></a><span>© 2026 Juniper · Food from independent kitchens</span><div class="footer-links"><a href="#how" data-scroll="how">How it works</a><a href="#/business">For sellers</a><a href="#/riders">Find a rider</a><a href="#/rider-apply">Become a rider</a><a class="footer-admin" href="#/admin">Admin review</a></div></div></footer>`;
    }

    function renderCartPanel() {
      const items = cartProducts();
      const qty = totalQty();
      const lines = items.length ? items.map(item => `<div class="cart-item"><div><div class="cart-item-name">${escapeHtml(item.name)}</div><div class="cart-item-price">${money(item.price)} each</div></div><div class="qty-control"><button data-action="decrease" data-id="${item.id}" aria-label="Remove one ${escapeHtml(item.name)}">−</button><span>${item.qty}</span><button data-action="increase" data-id="${item.id}" aria-label="Add one ${escapeHtml(item.name)}">+</button></div></div>`).join('') : `<div class="cart-empty"><span class="cart-empty-icon">${icon('bag')}</span><strong>Your basket is waiting</strong><p>Add food or a drink from the menu and it will show up here.</p></div>`;
      return `<aside class="cart-panel"><div class="cart-head"><div class="cart-head-row"><h2>Your order</h2><span class="cart-count">${qty}</span></div><div class="table-line">${icon('pin')} Table ${escapeHtml(state.currentTable)} <span>·</span> ${escapeHtml(publicSellerName(cartProducts()[0]?.sellerId || state.menuSellerId))}</div></div><div class="cart-body">${lines}</div><div class="cart-totals"><div class="total-row"><span>Subtotal</span><span>${money(cartTotal())}</span></div><div class="total-row"><span>Service fee</span><span>₦0</span></div><div class="total-row grand"><span>Total</span><span>${money(cartTotal())}</span></div><button class="btn btn-primary btn-wide" data-action="checkout" ${qty ? '' : 'disabled'}>Continue to checkout ${icon('arrow')}</button><p class="cart-note">Prices are shown in Nigerian naira. No hidden fees.</p></div></aside>`;
    }
    function renderMenu() {
      const nearbyEntries = state.customerLocation ? nearbySellerEntries() : [];
      const nearbyMap = new Map(nearbyEntries.map(entry => [entry.id, entry.distance]));
      const visibleFoods = products.filter(product => product.published !== false && (state.menuSellerId === 'all' || product.sellerId === state.menuSellerId) && (!state.customerLocation || nearbyMap.has(product.sellerId))).sort((a, b) => state.customerLocation ? (nearbyMap.get(a.sellerId) ?? Infinity) - (nearbyMap.get(b.sellerId) ?? Infinity) : 0);
      const categories = ['All', ...new Set(visibleFoods.map(product => product.category))];
      const filtered = visibleFoods.filter(product => (state.menuCategory === 'All' || product.category === state.menuCategory) && `${product.name} ${product.description} ${product.category} ${product.ingredients || ''} ${publicSellerName(product.sellerId)}`.toLowerCase().includes(state.menuSearch.toLowerCase()));
      const cards = filtered.length ? filtered.map(product => {
        const qty = Number(state.cart?.[product.id] || 0);
        const rating = productRating(product.id);
        const distance = nearbyMap.get(product.sellerId);
        return `<article class="food-card"><div class="food-art" data-action="food-details" data-id="${escapeHtml(product.id)}" role="button" tabindex="0" aria-label="View ${escapeHtml(product.name)} details">${dishSvg(product.art)}<span class="food-badge">${escapeHtml(product.badge || product.category)}</span></div><div class="food-content"><h3 data-action="food-details" data-id="${escapeHtml(product.id)}">${escapeHtml(product.name)}</h3><div class="food-seller-row"><a href="#/store/${encodeURIComponent(product.sellerId || 'juniper')}">By ${escapeHtml(publicSellerName(product.sellerId))}</a><span class="rating-inline">${starsLabel(rating.average)}${rating.count ? ` (${rating.count})` : ''}</span></div>${Number.isFinite(distance) ? `<small class="nearby-note">${distance.toFixed(1)} km away</small>` : ''}<p>${escapeHtml(product.description)}</p><div class="food-bottom"><span class="food-price">${money(product.price)}</span><div style="display:flex;align-items:center;gap:8px"><button class="btn btn-ghost" style="min-height:32px;padding:0 7px;font-size:9px" data-action="food-details" data-id="${escapeHtml(product.id)}">Reviews</button><button class="add-button ${qty ? 'added' : ''}" data-action="add" data-id="${escapeHtml(product.id)}" aria-label="${qty ? `Add one more ${escapeHtml(product.name)}` : `Add ${escapeHtml(product.name)} to order`}">${qty ? `${qty} +` : '+'}</button></div></div></div></article>`;
      }).join('') : `<div class="empty-results"><b>${state.customerLocation && !nearbyEntries.length ? 'No nearby sellers found yet' : 'No menu items found'}</b><span>${state.customerLocation && !nearbyEntries.length ? 'Sellers need to add a map location and delivery area before they appear nearby.' : 'Try another search or category.'}</span></div>`;
      const qty = totalQty();
      const locationText = state.customerLocation ? `${nearbyEntries.length} nearby seller${nearbyEntries.length === 1 ? '' : 's'} · location used for this visit only` : 'Find sellers near you';
      return `${renderHeader('inner')}<main class="container app-main"><div class="store-banner"><div><span class="store-kicker"><i class="status-dot"></i> Open for orders · Table ${escapeHtml(state.currentTable)}</span><h1>Find a drink or a dish.</h1><p>Browse ${state.menuSellerId === 'all' ? 'food and drinks from local kitchens' : `food and drinks from ${escapeHtml(publicSellerName(state.menuSellerId))}`} and meet the people behind them.</p></div><div class="store-info"><span>${icon('clock')} Freshly prepared</span><button class="btn btn-light" data-action="use-location">${icon('pin')} ${locationText}</button><a class="seller-profile-link" href="#/store/${encodeURIComponent(state.menuSellerId === 'all' ? 'juniper' : state.menuSellerId)}">${icon('user')} Seller profile</a></div></div>
        <div class="menu-controls"><div class="category-tabs">${categories.map(category => `<button class="category-btn ${state.menuCategory === category ? 'active' : ''}" data-action="category" data-category="${escapeHtml(category)}">${escapeHtml(category)}</button>`).join('')}</div><label class="search-wrap">${icon('search')}<input id="menu-search" type="search" value="${escapeHtml(state.menuSearch)}" placeholder="Search food, drinks or category" aria-label="Search menu items" /></label></div>
        <div class="menu-layout"><section class="food-grid" aria-label="Menu items">${cards}</section>${renderCartPanel()}</div>
      </main>${qty ? `<div class="mobile-cart-bar"><div class="mobile-cart-info"><b>${qty} item${qty === 1 ? '' : 's'} · ${money(cartTotal())}</b><small>Table ${escapeHtml(state.currentTable)} · ready to checkout</small></div><button class="btn btn-lime" data-action="checkout">View order ${icon('arrow')}</button></div>` : ''}`;
    }

    function renderCheckout() {
      const items = cartProducts();
      const orderSellerId = items[0]?.sellerId || 'juniper';
      const sellerNear = nearbySellerEntries().find(entry => entry.id === orderSellerId);
      const ridersNear = nearestAvailableRiders();
      if (state.deliveryMode === 'delivery' && !state.selectedRiderId && ridersNear[0]) state.selectedRiderId = ridersNear[0].id;
      const selectedRider = ridersNear.find(entry => entry.id === state.selectedRiderId) || ridersNear[0];
      if (!items.length) return `${renderHeader('inner')}<main class="container flow-main"><a class="flow-back" href="#/menu?table=${encodeURIComponent(state.currentTable)}">${icon('back')} Back to menu</a><div class="confirmation-wrap"><div class="success-ring">${icon('bag')}</div><h1>Your basket is empty.</h1><p>Add food or drinks from the menu and return here when you're ready.</p><div class="confirmation-actions" style="margin-top:22px"><a class="btn btn-primary" href="#/menu?table=${encodeURIComponent(state.currentTable)}">Explore menu ${icon('arrow')}</a></div></div></main>`;
      const itemRows = items.map(item => `<div class="checkout-item"><div class="checkout-item-art">${dishSvg(item.art)}</div><div><h3>${escapeHtml(item.name)}</h3><p>By ${escapeHtml(publicSellerName(item.sellerId))} · Qty ${item.qty}</p></div><span class="checkout-item-price">${money(item.price * item.qty)}</span></div>`).join('');
      const qty = items.reduce((n, item) => n + item.qty, 0);
      const deliveryPanel = `<section class="surface surface-pad delivery-choice-card"><div class="surface-title"><h2>Pickup or delivery</h2><small>${state.customerLocation ? 'Location permission granted for this visit' : 'Your location is not saved'}</small></div><div class="delivery-mode-buttons"><button class="btn ${state.deliveryMode === 'pickup' ? 'btn-primary' : 'btn-light'}" data-action="delivery-mode" data-mode="pickup">Pickup / dine in</button><button class="btn ${state.deliveryMode === 'delivery' ? 'btn-primary' : 'btn-light'}" data-action="delivery-mode" data-mode="delivery">Deliver to me</button></div><p class="summary-note">Use your device location to find nearby sellers and the closest available rider. Juniper only uses these coordinates in this browser session. The delivery fee is included in the seller's total; this preview does not split or transfer rider payouts.</p><button class="btn btn-light" data-action="use-location">${icon('pin')} ${state.customerLocation ? 'Refresh my location' : 'Use my current location'}</button>${sellerNear ? `<p class="nearby-note">${escapeHtml(publicSellerName(orderSellerId))} · about ${sellerNear.distance.toFixed(1)} km away</p>` : state.customerLocation ? `<p class="nearby-note">This seller is outside your delivery radius or has no map pin. Choose pickup or select a nearby seller.</p>` : ''}${state.deliveryMode === 'delivery' ? `<label class="field-label" for="delivery-address">Delivery address</label><textarea class="form-input" id="delivery-address" maxlength="240" placeholder="Street, building, apartment or landmark" required>${escapeHtml(state.deliveryAddress)}</textarea>${selectedRider ? `<div class="nearest-rider-card"><b>Nearest available rider</b><a href="#/rider-profile/${encodeURIComponent(selectedRider.id)}">${escapeHtml(selectedRider.profile.name)}</a><span>${selectedRider.distance.toFixed(1)} km away · ${money(selectedRider.profile.baseFee || 0)} delivery fee</span><a href="#/riders?from=checkout">Search or choose another rider</a></div>` : `<div class="nearby-note">${state.customerLocation ? 'No approved riders are available near this location yet. Choose pickup or try again later.' : 'Use your current location to find nearby riders.'} <a href="#/riders?from=checkout">Search all riders</a> · <a href="#/rider-apply">Apply to deliver</a></div>`}` : ''}</section>`;
      const deliveryFee = state.deliveryMode === 'delivery' && selectedRider ? Math.max(0, Math.round(Number(selectedRider.profile.baseFee || 0))) : 0;
      const canPlace = state.deliveryMode !== 'delivery' || Boolean(state.customerLocation && sellerNear && state.deliveryAddress.trim() && selectedRider);
      return `${renderHeader('inner')}<main class="container flow-main"><a class="flow-back" href="#/menu?table=${encodeURIComponent(state.currentTable)}">${icon('back')} Back to menu</a><div class="flow-heading"><div class="flow-steps"><span class="current">01 · Your order</span><i></i><span>02 · Choose payment</span><i></i><span>03 · Confirmation</span></div><h1>Review your order.</h1><p>${state.deliveryMode === 'delivery' ? `Delivery from ${escapeHtml(publicSellerName(orderSellerId))}` : `Items from ${escapeHtml(publicSellerName(orderSellerId))} · Table ${escapeHtml(state.currentTable)}`}.</p></div>
        <div class="checkout-layout"><section style="display:grid;gap:14px"><section class="surface surface-pad"><div class="surface-title"><h2>Your order</h2><small>${qty} item${qty === 1 ? '' : 's'}</small></div>${itemRows}<div style="padding-top:15px"><a class="flow-back" href="#/menu?table=${encodeURIComponent(state.currentTable)}&s=${encodeURIComponent(orderSellerId)}">＋ Add another item</a></div><p class="summary-note">There is no item-count limit. Each checkout is for one seller; use separate checkouts for another kitchen so payment goes to the correct seller.</p></section>${deliveryPanel}</section>
          <aside class="surface surface-pad"><div class="surface-title"><h2>Order details</h2><small>${qty} item${qty === 1 ? '' : 's'}</small></div>
            <div class="account-box"><span class="account-icon">${icon('user')}</span><div><b>${state.user ? `Ordering as ${escapeHtml(state.user.name)}` : 'Sign in or create a buyer account'}</b><small>${state.user ? escapeHtml(state.user.email) : 'Buyer accounts are available immediately.'}</small></div></div>
            <div class="summary-total"><div class="total-row"><span>Items subtotal</span><span>${money(cartTotal())}</span></div><div class="total-row"><span>Delivery</span><span>${state.deliveryMode === 'delivery' ? money(deliveryFee) : 'Pickup'}</span></div><div class="total-row grand"><span>Total to pay</span><span>${money(cartTotal() + deliveryFee)}</span></div></div>
            <button class="btn btn-primary btn-wide" style="margin-top:7px" data-action="place-order" ${canPlace ? '' : 'disabled'}>${state.user ? 'Place order & choose payment' : 'Sign in to continue'} ${icon('arrow')}</button>
            <p class="summary-note">Payment is complete only after the seller or connected payment provider confirms it.</p>
          </aside></div></main>`;
    }

    function renderPayment() {
      const order = getRouteOrder();
      const qrText = order.request ? makePaymentRequestLink(order) : paymentLink(order);
      const profileKnown = Boolean(sellerProfiles[order.sellerId]);
      const profile = sellerFor(order.sellerId);
      const displaySellerName = profileKnown ? profile.publicName : (order.sellerName || 'Seller');
      const sellerChat = whatsappHref(profile.whatsapp || profile.phone);
      const sellerPhone = phoneHref(profile.phone);
      const sellerContactActions = `${sellerPhone ? `<a class="btn btn-light" href="${escapeHtml(sellerPhone)}">Call seller</a>` : ''}${sellerChat ? `<a class="btn btn-light" href="${escapeHtml(sellerChat)}" target="_blank" rel="noopener noreferrer">WhatsApp seller</a>` : ''}`;
      const bankReady = profileKnown && Boolean(profile.bankName && profile.accountName && profile.accountNumber);
      const opayReady = profileKnown && Boolean(safeWebLink(profile.opayLink));
      const walletReady = profileKnown && Boolean(safeWebLink(profile.walletLink));
      const methods = [
        { id: 'qr', label: 'QR payment', symbol: 'QR', description: 'Share or scan this order link', ready: true },
        { id: 'bank', label: 'Bank / account transfer', symbol: 'BANK', description: bankReady ? `Send directly to ${profile.bankName}` : 'Seller account details not set', ready: bankReady },
        { id: 'opay', label: 'OPay', symbol: 'OP', description: opayReady ? 'Open seller’s OPay checkout' : 'Seller OPay link not set', ready: opayReady },
        { id: 'wallet', label: 'Other wallets', symbol: 'WALLET', description: walletReady ? 'Open the connected wallet' : 'Wallet link not set', ready: walletReady }
      ];
      if (!methods.some(method => method.id === state.paymentMethod)) state.paymentMethod = 'qr';
      const methodTiles = methods.map(method => `<button class="method-card ${state.paymentMethod === method.id ? 'selected' : ''} ${method.ready ? '' : 'unavailable'}" data-action="payment-method" data-method="${method.id}"><span class="method-symbol">${method.symbol}</span><span><b>${method.label}</b><small>${method.description}</small></span></button>`).join('');
      let methodContent = '';
      if (state.paymentMethod === 'qr') {
        methodContent = `<div class="payment-instructions"><h3>Order payment QR</h3><p>Scan this code or share it with the buyer. It opens the payment page for <b>${money(order.total)}</b> with order reference <b>${escapeHtml(order.id)}</b>.</p><div class="payment-qr-wrap">${qrSvg(qrText, 'payment-qr', 220)}<strong>${escapeHtml(displaySellerName)}</strong><small>${escapeHtml(order.id)} · ${money(order.total)}</small></div><div class="share-actions"><button class="btn btn-light" data-action="copy-payment" data-link="${escapeHtml(qrText)}">${icon('copy')} Copy link</button><button class="btn btn-light" data-action="share-whatsapp" data-link="${escapeHtml(qrText)}" data-message="Payment request ${order.id} · ${money(order.total)} to ${escapeHtml(displaySellerName)}">WhatsApp</button><button class="btn btn-light" data-action="share-native" data-link="${escapeHtml(qrText)}" data-message="Payment request ${order.id} · ${money(order.total)} to ${escapeHtml(displaySellerName)}">Share</button><button class="btn btn-light" data-action="download-qr" data-qr-id="payment-qr" data-file="juniper-payment-${escapeHtml(order.id)}.svg">${icon('download')} Save QR</button></div></div>`;
      } else if (state.paymentMethod === 'bank') {
        methodContent = bankReady ? `<div class="payment-instructions"><h3>Transfer to ${escapeHtml(profile.bankName)}</h3><p>Transfer directly to this seller’s account and include the order reference in your transfer note. Confirm the seller name and amount before sending.</p><div class="payment-account"><span>Account name</span><strong>${escapeHtml(profile.accountName)}</strong></div><div class="payment-account"><span>Account number</span><strong>${escapeHtml(profile.accountNumber)}</strong></div><div class="payment-account"><span>Amount</span><strong>${money(order.total)}</strong></div><div class="payment-account"><span>Reference</span><strong>${escapeHtml(order.id)}</strong></div><button class="btn btn-light btn-wide" style="margin-top:12px" data-action="copy-bank" data-text="${escapeHtml(`${profile.bankName} · ${profile.accountName} · ${profile.accountNumber} · ${money(order.total)} · Ref ${order.id}`)}">${icon('copy')} Copy transfer details</button></div>` : `<div class="payment-instructions"><h3>Bank transfer</h3><p>This seller has not added bank transfer details yet. Choose QR payment or contact the seller.</p></div>`;
      } else if (state.paymentMethod === 'opay') {
        methodContent = opayReady ? `<div class="payment-instructions"><h3>Pay with OPay</h3><p>Continue to the seller’s OPay payment page. Check the seller name and amount before confirming.</p><a class="btn btn-primary btn-wide" href="${escapeHtml(safeWebLink(profile.opayLink))}" target="_blank" rel="noopener noreferrer">Open OPay checkout ${icon('arrow')}</a><p>After paying, return here and submit the transfer for seller verification.</p></div>` : `<div class="payment-instructions"><h3>OPay</h3><p>OPay is available once the seller connects an OPay checkout link in payment settings.</p></div>`;
      } else {
        methodContent = walletReady ? `<div class="payment-instructions"><h3>Pay with wallet</h3><p>Continue to the connected wallet, then return here to submit the payment for verification.</p><a class="btn btn-primary btn-wide" href="${escapeHtml(safeWebLink(profile.walletLink))}" target="_blank" rel="noopener noreferrer">Open wallet checkout ${icon('arrow')}</a></div>` : `<div class="payment-instructions"><h3>Other wallets</h3><p>Supported wallets appear here when the seller connects a checkout link.</p></div>`;
      }
      const receiptPanel = order.paymentStatus === 'paid' ? '' : `<form id="receipt-form" class="receipt-panel"><input type="hidden" name="orderId" value="${escapeHtml(order.id)}" /><b>Send a payment receipt</b><p>Choose a receipt image, then share it using your device share sheet. The preview does not upload or save receipt files; the seller must confirm payment.</p><label class="field-label" for="payment-receipt">Receipt screenshot or photo</label><input class="form-input" id="payment-receipt" name="receipt" type="file" accept="image/*,.pdf,application/pdf" required /><button class="btn btn-light btn-wide" type="submit">Share receipt with seller ${icon('arrow')}</button>${sellerChat ? `<a class="receipt-whatsapp-link" href="${escapeHtml(`${sellerChat}?text=${encodeURIComponent(`Payment receipt for ${order.id} · ${money(order.total)} to ${displaySellerName}. Please confirm.`)}`)}" target="_blank" rel="noopener noreferrer">Open seller WhatsApp (attach the receipt manually)</a>` : ''}</form>`;
      const summaryItems = order.items?.length ? order.items.map(item => `<div class="summary-item-line"><span>${item.qty} × ${escapeHtml(item.name)}</span><strong>${money(item.qty * item.price)}</strong></div>`) : `<div class="summary-item-line"><span>${escapeHtml(order.note || (order.request ? 'Seller payment request' : 'Food order'))}</span><strong>${money(order.total)}</strong></div>`;
      const paymentStatus = order.paymentStatus === 'paid' ? 'Verified by seller' : order.paymentStatus === 'verification' ? 'Payment submitted · Awaiting seller verification' : 'Awaiting payment';
      const qrLinkForPayment = qrText;
      return `${renderHeader('inner')}<main class="container flow-main"><a class="flow-back" href="#/menu?table=${encodeURIComponent(order.table || state.currentTable)}">${icon('back')} Back to food</a><div class="flow-heading"><div class="flow-steps"><span>01 · Your order</span><i></i><span class="current">02 · Choose payment</span><i></i><span>03 · Confirmation</span></div><h1>Choose how to pay.</h1><p>Payment request for ${escapeHtml(displaySellerName)} · ${order.deliveryMode === 'delivery' ? `Delivery to ${escapeHtml(order.deliveryAddress || 'your address')}` : order.table && order.table !== '—' ? `Table ${escapeHtml(order.table)}` : 'Shared payment link'}.</p></div>
        <div class="payment-layout"><section class="surface payment-main-card"><span class="payment-badge">${icon('shield')} Seller payment options</span><h2>${order.paymentStatus === 'paid' ? 'Payment verified' : 'Select a payment method'}</h2><p>Review the seller and amount before paying. Transfers are marked complete only after verification.</p><div class="payment-methods">${methodTiles}</div>${methodContent}${receiptPanel}
          <div class="account-box" style="margin-top:15px"><span class="account-icon">${icon(order.paymentStatus === 'paid' ? 'check' : 'clock')}</span><div><b>${escapeHtml(paymentStatus)}</b><small>Reference ${escapeHtml(order.id)} · ${money(order.total)}</small></div></div>
          ${order.paymentStatus === 'paid' ? `<a class="btn btn-primary btn-wide" style="margin-top:13px" href="#/confirmation/${encodeURIComponent(order.id)}">View order confirmation ${icon('arrow')}</a>` : order.paymentStatus === 'verification' ? `<div class="payment-status-note" style="margin-top:13px">Your payment notice is waiting for seller verification. Keep the reference ${escapeHtml(order.id)}.</div>` : `<button class="btn btn-primary btn-wide" style="margin-top:13px" data-action="payment-submitted" data-id="${escapeHtml(order.id)}" ${state.paymentMethod !== 'qr' && !(state.paymentMethod === 'bank' ? bankReady : state.paymentMethod === 'opay' ? opayReady : walletReady) ? 'disabled' : ''}>I’ve completed this payment ${icon('arrow')}</button>`}
          <div class="payment-safety-note">${icon('info')}<span>Bank transfers go directly to the seller’s account. Receipt sharing is user-confirmed; this preview cannot upload or automatically forward files to WhatsApp, and it never marks money paid without seller verification.</span></div>
        </section><aside class="surface order-summary-card"><div class="summary-card-head"><h2>Payment summary</h2><p>${escapeHtml(displaySellerName)} · ${escapeHtml(profileKnown ? profile.location : 'Seller payment request')}</p></div><div class="summary-card-body"><div class="summary-order-number"><span>REFERENCE</span><strong>${escapeHtml(order.id)}</strong></div>${summaryItems}<div class="summary-item-line"><span>${order.deliveryMode === 'delivery' ? `Delivery · ${escapeHtml(order.riderName || 'nearest rider')}` : 'Service fee'}</span><strong>${order.deliveryMode === 'delivery' ? money(order.deliveryFee || 0) : '₦0'}</strong></div><div class="summary-item-line total"><span>Total</span><strong>${money(order.total)}</strong></div><div class="payment-status-note">${escapeHtml(paymentStatus)}</div><div class="share-actions"><button class="btn btn-light" data-action="share-whatsapp" data-link="${escapeHtml(qrLinkForPayment)}" data-message="Payment request ${order.id} · ${money(order.total)} to ${escapeHtml(displaySellerName)}">Share on WhatsApp</button><button class="btn btn-light" data-action="copy-payment" data-link="${escapeHtml(qrLinkForPayment)}">Copy link</button>${sellerContactActions}</div></div></aside></div></main>`;
    }

    function renderConfirmation() {
      const order = findOrder(state.route.id) || getRouteOrder();
      const itemNames = order.items?.length ? order.items.map(item => `${item.qty} × ${item.name}`).join(' · ') : (order.note || 'Payment request');
      const confirmed = order.paymentStatus === 'paid';
      return `${renderHeader('inner')}<main class="container flow-main"><div class="confirmation-wrap"><span class="eyebrow"><i class="eyebrow-dot"></i> ${confirmed ? 'Payment verified' : 'Payment update'}</span><div class="success-ring">${icon(confirmed ? 'check' : 'clock')}</div><h1>${confirmed ? `Thank you, ${escapeHtml(firstName())}.` : 'Transfer submitted.'}</h1><p>${confirmed ? 'The seller has verified your payment. Keep the order reference handy if you need support.' : 'Your payment notice has been sent. The order remains pending until the seller or payment provider verifies it.'}</p><div class="confirmation-card"><div class="confirmation-card-top"><b>Reference ${escapeHtml(order.id)}</b><span>${confirmed ? '✓ Verified' : 'Awaiting verification'}</span></div><p>${escapeHtml(itemNames)}<br />Seller: <b>${escapeHtml(publicSellerName(order.sellerId))}</b>${order.deliveryMode === 'delivery' ? `<br />Delivery to: ${escapeHtml(order.deliveryAddress || '')}<br />Rider: <a href="#/rider-profile/${encodeURIComponent(order.riderId)}">${escapeHtml(order.riderName || 'Assigned rider')}</a> · ${escapeHtml(order.deliveryStatus || 'assigned')}` : ''}<br />Amount: <b>${money(order.total)}</b></p></div><div class="confirmation-actions"><a class="btn btn-primary" href="#/menu?table=${encodeURIComponent(order.table || '08')}">Browse more food ${icon('arrow')}</a><a class="btn btn-light" href="#/store/${encodeURIComponent(order.sellerId || 'juniper')}">Seller profile</a></div></div></main>`;
    }

    function renderActivity() {
      const recent = state.orders.filter(order => (order.sellerId || 'juniper') === currentSellerId()).slice(0, 8);
      if (!recent.length) return `<div class="cart-empty" style="padding:26px 8px"><span class="cart-empty-icon">${icon('bag')}</span><strong>No orders yet</strong><p>Shared payment requests and customer orders will appear here.</p></div>`;
      return recent.map(order => {
        const title = order.items?.[0]?.name || order.note || 'Payment request';
        const status = order.paymentStatus === 'paid' ? 'Verified' : order.paymentStatus === 'verification' ? 'Needs verification' : 'Awaiting payment';
        const verify = order.paymentStatus === 'verification' && isSeller() ? `<button class="btn btn-light" data-action="verify-payment" data-id="${escapeHtml(order.id)}">Verify</button>` : '';
        const delivery = order.riderId ? `<small>Rider ${escapeHtml(order.riderName)} · ${escapeHtml(order.deliveryStatus || 'assigned')}</small>` : '';
        return `<div class="activity-item"><span class="activity-avatar">${escapeHtml(initials(order.user))}</span><div><b>${escapeHtml(title)}</b><small>${escapeHtml(order.id)} · ${escapeHtml(order.table || 'Shared request')}</small>${delivery}</div><div class="activity-right"><strong>${money(order.total)}</strong><small class="${order.paymentStatus === 'paid' ? 'status-paid' : 'status-pending'}">● ${status}</small>${verify}</div></div>`;
      }).join('');
    }

    function renderFoodEditor() {
      if (!state.editingFood) return '';
      const existing = state.editingFood !== 'new' ? products.find(product => product.id === state.editingFood) : null;
      const lockedMs = foodCooldownMs(existing);
      const category = existing?.category || 'Bowls';
      const categoryOptions = categoriesForSeller().map(name => `<option value="${escapeHtml(name)}" ${name === category ? 'selected' : ''}>${escapeHtml(name)}</option>`).join('');
      const lockNote = lockedMs ? `<div class="cooldown-note">This menu item was recently updated. You can edit it again in <b>${prettyRemaining(lockedMs)}</b> (at ${new Date(Date.now() + lockedMs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }).replace(/&/g, '&amp;')}).</div>` : '';
      return `<form id="food-form" class="surface seller-form"><div class="surface-title"><h2>${existing ? 'Edit menu item' : 'Add food or drink'}</h2><button class="btn btn-ghost" type="button" data-action="cancel-food-edit">Close</button></div><p>Update the details customers see. Food and drink listings can be edited once every two hours.</p>${lockNote}<input type="hidden" name="foodId" value="${escapeHtml(existing?.id || '')}" />
        <label class="field-label" for="food-name">Menu item name</label><input class="form-input" id="food-name" name="name" maxlength="70" required value="${escapeHtml(existing?.name || '')}" placeholder="e.g. Grilled suya bowl or zobo cooler" ${lockedMs ? 'disabled' : ''} />
        <div class="form-grid-2"><div><label class="field-label" for="food-category">Category</label><select class="form-input" id="food-category" name="category" ${lockedMs ? 'disabled' : ''}>${categoryOptions}</select></div><div><label class="field-label" for="food-price">Price (₦)</label><input class="form-input" id="food-price" name="price" type="number" min="100" step="50" required value="${existing?.price || ''}" placeholder="12500" ${lockedMs ? 'disabled' : ''} /></div></div>
        <label class="field-label" for="food-description">Description</label><textarea class="form-input" id="food-description" name="description" maxlength="240" required placeholder="Describe the flavour, serving size and what makes it special." ${lockedMs ? 'disabled' : ''}>${escapeHtml(existing?.description || '')}</textarea>
        <label class="field-label" for="food-ingredients">Ingredients</label><input class="form-input" id="food-ingredients" name="ingredients" maxlength="180" value="${escapeHtml(existing?.ingredients || '')}" placeholder="Key ingredients" ${lockedMs ? 'disabled' : ''} />
        <div class="form-grid-2"><div><label class="field-label" for="food-allergens">Allergens</label><input class="form-input" id="food-allergens" name="allergens" maxlength="100" value="${escapeHtml(existing?.allergens || '')}" placeholder="e.g. sesame, dairy" ${lockedMs ? 'disabled' : ''} /></div><div><label class="field-label" for="food-prep">Prep time</label><input class="form-input" id="food-prep" name="prepTime" maxlength="30" value="${escapeHtml(existing?.prepTime || '')}" placeholder="15–20 min" ${lockedMs ? 'disabled' : ''} /></div></div>
        <label class="field-label" for="food-badge">Short label</label><input class="form-input" id="food-badge" name="badge" maxlength="25" value="${escapeHtml(existing?.badge || '')}" placeholder="House favourite" ${lockedMs ? 'disabled' : ''} />
        <div class="auto-image-note">${icon('spark')} A Juniper illustration is automatically assigned from the selected category. No photo or video upload is needed.</div><button class="btn btn-primary btn-wide" type="submit" ${lockedMs ? 'disabled' : ''}>${existing ? 'Save menu changes' : 'Publish menu item'} ${icon('arrow')}</button></form>`;
    }

    function renderCategoryManager() {
      const sellerId = currentSellerId();
      const categories = categoriesForSeller(sellerId);
      const chips = categories.map(name => `<span class="category-chip ${sellerCategories.some(item => item.sellerId === sellerId && item.name === name) ? 'custom' : ''}">${escapeHtml(name)}</span>`).join('');
      return `<section class="surface seller-form category-manager"><h2>Food categories</h2><p>Use the built-in categories or add your own cuisine, meal type, dietary, or seasonal labels. There is no preset seller taxonomy.</p><form id="category-form"><label class="field-label" for="new-category">Create a category</label><div class="category-create-row"><input class="form-input" id="new-category" name="categoryName" maxlength="50" required placeholder="e.g. Nigerian street food" /><button class="btn btn-primary" type="submit">Add category</button></div></form><div class="category-chip-list">${chips}</div></section>`;
    }

    function renderPaymentSettings() {
      const profile = currentSellerProfile();
      return `<form id="payment-settings-form" class="surface seller-form"><h2>Payment setup</h2><p>Buyers see these options on the separate payment screen. Enter a bank or wallet account (for example, OPay) to receive direct transfers. This preview does not move money.</p><label class="field-label" for="bank-name">Bank / wallet provider</label><input class="form-input" id="bank-name" name="bankName" value="${escapeHtml(profile.bankName || '')}" placeholder="Bank" />
        <div class="form-grid-2"><div><label class="field-label" for="account-name">Account name</label><input class="form-input" id="account-name" name="accountName" value="${escapeHtml(profile.accountName || '')}" placeholder="Account holder" /></div><div><label class="field-label" for="account-number">Account number</label><input class="form-input" id="account-number" name="accountNumber" inputmode="numeric" maxlength="20" value="${escapeHtml(profile.accountNumber || '')}" placeholder="10-digit number" /></div></div>
        <label class="field-label" for="opay-link">OPay checkout link</label><input class="form-input" id="opay-link" name="opayLink" type="url" value="${escapeHtml(profile.opayLink || '')}" placeholder="https://…" />
        <label class="field-label" for="wallet-link">Other wallet checkout link</label><input class="form-input" id="wallet-link" name="walletLink" type="url" value="${escapeHtml(profile.walletLink || '')}" placeholder="https://…" />
        <button class="btn btn-primary btn-wide" type="submit" style="margin-top:14px">Save payment options ${icon('arrow')}</button></form>`;
    }

    function renderBusiness() {
      if (!isSeller()) {
        const pendingApplication = state.user && sellerApplications.find(application => application.email.toLowerCase() === state.user.email.toLowerCase());
        const oldSellerNeedsCheck = state.user?.role === 'seller';
        const gateContent = !state.user
          ? `<span class="eyebrow">Seller mode</span><h2>Grow your food business on Juniper.</h2><p>Create a buyer account or sign in first. Seller tools require a verified seller profile; you can keep ordering as a buyer.</p><button class="btn btn-primary" data-action="open-signin">Sign in or create account ${icon('arrow')}</button>`
          : oldSellerNeedsCheck
            ? `<span class="eyebrow">Identity verification required</span><h2>Seller tools are paused until secure verification is available.</h2><p>This preview cannot securely verify legal names, passport photos or seller profile photos. Your account can still order as a customer; seller publishing remains locked.</p><span class="admin-status">Verification unavailable</span>`
            : pendingApplication
              ? `<span class="eyebrow">Application under review</span><h2>${escapeHtml(pendingApplication.storeName)} is awaiting verification.</h2><p>Your Juniper buyer account remains active and you can continue ordering. This application is saved only in this browser; no documents were uploaded. Seller mode stays locked until secure review verifies the legal name, passport photo, business address and profile photo.</p><span class="admin-status">Pending secure verification</span>`
              : `<span class="eyebrow">Seller mode</span><h2>Ready to sell on Juniper?</h2><p>Your buyer account stays active. A seller application asks for your legal name, passport and profile pictures, business address, contact details and location. Secure verification is not available in this browser-only preview.</p><button class="btn btn-primary" data-action="request-seller">Apply for seller mode ${icon('arrow')}</button>`;
        return `${renderHeader('business')}<main class="container business-main"><section class="surface seller-gate"><div class="success-ring">${icon(pendingApplication || oldSellerNeedsCheck ? 'clock' : 'user')}</div>${gateContent}</section></main>`;
      }
      const profile = currentSellerProfile();
      const sellerId = currentSellerId();
      const table = state.businessTable || '08';
      const link = menuLink(table, sellerId);
      const options = Array.from({ length: 12 }, (_, index) => String(index + 1).padStart(2, '0')).map(number => `<option value="${number}" ${number === table ? 'selected' : ''}>Table ${number}</option>`).join('');
      const allOrders = state.orders.filter(order => (order.sellerId || 'juniper') === sellerId);
      const paidTotal = allOrders.filter(order => order.paymentStatus === 'paid').reduce((sum, order) => sum + Number(order.total || 0), 0);
      const pendingCount = allOrders.filter(order => order.paymentStatus !== 'paid').length;
      const ownedFoods = products.filter(product => product.sellerId === sellerId);
      const foodRows = ownedFoods.map(product => {
        const rating = productRating(product.id);
        const locked = foodCooldownMs(product);
        return `<div class="seller-food-row"><div class="seller-food-thumb">${dishSvg(product.art)}</div><div><h3>${escapeHtml(product.name)}</h3><small>${escapeHtml(product.category)} · ${money(product.price)} · ${rating.count ? `${starsLabel(rating.average)} (${rating.count})` : 'No reviews yet'} · ${product.published === false ? 'Unpublished' : 'Published'}</small>${locked ? `<small class="status-pending">Edit available in ${prettyRemaining(locked)}</small>` : ''}</div><div class="seller-food-actions"><button class="btn btn-light" data-action="edit-food" data-id="${escapeHtml(product.id)}" ${locked ? 'disabled title="Available after two hours"' : ''}>Edit</button></div></div>`;
      }).join('');
      const latestRequest = allOrders.find(order => order.request);
      const requestCard = latestRequest ? `<div class="payment-request-card"><h3>Latest shared payment request · ${money(latestRequest.total)}</h3><p>${escapeHtml(latestRequest.note || 'Payment request')} · ${escapeHtml(latestRequest.id)}</p><div class="payment-qr-wrap qr-small">${qrSvg(makePaymentRequestLink(latestRequest), 'seller-payment-qr', 120)}<strong>${escapeHtml(latestRequest.id)}</strong></div><div class="share-actions"><button class="btn btn-light" data-action="share-whatsapp" data-link="${escapeHtml(makePaymentRequestLink(latestRequest))}" data-message="Payment request ${latestRequest.id} · ${money(latestRequest.total)} to ${escapeHtml(publicSellerName(sellerId))}">WhatsApp</button><button class="btn btn-light" data-action="copy-payment" data-link="${escapeHtml(makePaymentRequestLink(latestRequest))}">Copy link</button><button class="btn btn-light" data-action="download-qr" data-qr-id="seller-payment-qr" data-file="juniper-request-${escapeHtml(latestRequest.id)}.svg">Save QR</button></div></div>` : '';
      return `${renderHeader('business')}<main class="container business-main"><div class="business-top"><div><span class="eyebrow"><i class="eyebrow-dot"></i> Seller studio</span><h1>${escapeHtml(publicSellerName(sellerId))}</h1><p>Public profile, food and drink listings, customer tags, payment QR requests and orders.</p></div><a class="btn btn-light" href="#/store/${encodeURIComponent(sellerId)}">View public profile ${icon('arrow')}</a></div>
        <section class="stats-grid" aria-label="Seller activity"><article class="stat-card"><div class="stat-top">Orders & requests <span class="stat-icon">${icon('bag')}</span></div><strong>${allOrders.length}</strong><div class="stat-foot"><span>Saved in this workspace</span></div></article><article class="stat-card"><div class="stat-top">Verified payments <span class="stat-icon">${icon('card')}</span></div><strong>${money(paidTotal)}</strong><div class="stat-foot"><span>Confirmed by seller</span></div></article><article class="stat-card"><div class="stat-top">Awaiting payment or review <span class="stat-icon">${icon('clock')}</span></div><strong>${pendingCount}</strong><div class="stat-foot"><span>Verify transfers before marking paid</span></div></article></section>
        <section class="business-grid"><article class="qr-manager"><div class="qr-manager-copy"><span class="eyebrow">${icon('qr')} TABLE QR CODES</span><h2>Share a code for every table.</h2><p>Guests land on your menu with the table number already selected. They can order and choose a payment option.</p><div class="table-select-wrap"><label for="business-table">Table</label><select id="business-table">${options}</select></div><div class="qr-manager-actions"><button class="btn btn-lime" data-action="copy-menu-link" data-link="${escapeHtml(link)}">${icon('copy')} Copy table link</button><button class="btn btn-light" data-action="share-whatsapp" data-link="${escapeHtml(link)}" data-message="Order from ${escapeHtml(publicSellerName(sellerId))}">WhatsApp</button><button class="btn btn-light" data-action="download-qr" data-qr-id="business-qr" data-file="juniper-table-${table}.svg">${icon('download')} Download QR</button></div></div><a class="qr-white-card" href="#/menu?table=${encodeURIComponent(table)}&s=${encodeURIComponent(sellerId)}" aria-label="Preview menu for table ${escapeHtml(table)}">${qrSvg(link, 'business-qr', 160)}<b>TABLE ${escapeHtml(table)} · SCAN TO ORDER</b><small>Tap to preview the guest menu</small></a></article>
          <article class="activity-card"><div class="activity-head"><h2>Recent orders & payments</h2><a href="#/admin">Account approvals</a></div>${renderActivity()}</article></section>
